<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算命仙</title>
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --ink: #2b2620; --muted: #7a7064; --line: #ddd4c4;
  --grid: #ebe4d6; --year: #b58a3c; --accent: #a4462b;
  --read: #3d8a5a; --part: #c98b1e; --unread: #9a9184; --sel: #a4462b;
  --node: #ffffff; --main: #f3e6cf; --chip: #efe7d8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151a; --panel: #1f1c22; --ink: #ece6dc; --muted: #9b9184; --line: #39333b;
    --grid: #26222a; --year: #d4a55a; --accent: #e07a55;
    --read: #5fb27f; --part: #e2a640; --unread: #6f675f; --sel: #e07a55;
    --node: #262229; --main: #2f2820; --chip: #2c2730;
  }
}
:root[data-theme="dark"] {
  --bg: #17151a; --panel: #1f1c22; --ink: #ece6dc; --muted: #9b9184; --line: #39333b;
  --grid: #26222a; --year: #d4a55a; --accent: #e07a55;
  --read: #5fb27f; --part: #e2a640; --unread: #6f675f; --sel: #e07a55;
  --node: #262229; --main: #2f2820; --chip: #2c2730;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; display: flex; flex-direction: column; }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--panel); position: relative; }
/* 問題回報：右上，勾選列的下方 */
#report { position: absolute; right: 16px; bottom: 8px; font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); text-decoration: none; background: var(--bg); }
#report:hover { color: var(--accent); border-color: var(--accent); }
@media (max-width: 760px) { #report { position: static; } }
header h1 { font-size: 17px; margin: 0; letter-spacing: .05em; cursor: pointer; }
header h1.on { color: var(--accent); }
header .stats { color: var(--muted); font-size: 12px; }
header label { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; user-select: none; }
header input[type=search] { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 220px; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
main { flex: 1; display: flex; min-height: 0; position: relative; }
#chart { flex: 1; overflow: auto; position: relative; }
#arcbar { position: sticky; top: 0; left: 0; z-index: 6; background: var(--bg); padding: 8px 12px 6px; border-bottom: 1px solid var(--line); }
#arcbar .fchips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 2px 0; }
#arcbar .fchips > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
#arcbar button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer; }
#arcbar button small { color: var(--muted); font-size: 11px; margin-left: 4px; }
#arcbar button.on { border-color: var(--accent); color: var(--accent); }
#arcbar button img { width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; margin-right: 3px; object-fit: cover; object-position: top; }
#arcview { padding: 4px 12px 40px; }
#arcview .arow { display: grid; grid-template-columns: 118px 1fr; border-top: 1px solid var(--line); padding: 6px 0; }
#arcview .arow.empty { opacity: .45; padding: 1px 0; font-size: 12px; }
#arcview .arow.now { background: color-mix(in srgb, var(--accent) 10%, transparent); }
#arcview .awhen { color: var(--year); cursor: pointer; } #arcview .awhen b { color: var(--ink); font-weight: 600; margin-right: 4px; }
#arcview .acells { display: flex; gap: 10px; flex-wrap: wrap; }
#arcview .acol { min-width: 190px; } #arcview .apl { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
#arcview .acard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--unread); border-radius: 8px; padding: 4px 9px; margin-bottom: 5px; max-width: 330px; cursor: pointer; }
#arcview .acard.read { border-left-color: var(--read); } #arcview .acard.part { border-left-color: var(--part); } #arcview .acard.none { border-left-color: var(--line); }
#arcview .acard.sel { outline: 2px solid var(--sel); } #arcview .acard.dim { opacity: .3; }
#arcview .acard .am { font-size: 12px; color: var(--muted); } #arcview .acard .mainmark { color: var(--accent); font-size: 12px; margin-right: 4px; }
#arcview .ahead { margin: 8px 0 4px; font-size: 16px; } #arcview .ahead span { color: var(--muted); font-size: 13px; font-weight: 400; }
body.arcmode #canvas { display: none; }
#canvas { position: relative; }
/* 右側欄蓋在頁面上（不擠左邊的排版） */
#detail { position: absolute; top: 0; right: 0; bottom: 0; z-index: 8; width: clamp(360px, var(--dw, 50vw), 80vw); box-sizing: border-box; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px 40px; box-shadow: -8px 0 24px rgba(0,0,0,.35); }
/* 右側欄寬度：拖拉中間的分隔線，或按 ½／¾ */
#splitter { position: absolute; top: 0; bottom: 0; right: calc(clamp(360px, var(--dw, 50vw), 80vw) - 3px); width: 6px; cursor: col-resize; background: transparent; z-index: 9; }
#splitter:hover, #splitter.drag { background: rgba(233,135,91,.35); }
/* 右側欄開合：點事件才展開，✕／Esc 收起，收起後右邊緣「◂」再打開 */
body.dclosed #detail, body.dclosed #splitter { display: none; }
#detail > h2:first-child { padding-right: 30px; }
#dclose { position: fixed; right: 14px; z-index: 10; display: none; background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font: inherit; }
#dclose:hover, #dopen:hover { color: var(--accent); border-color: var(--accent); }
body:not(.dclosed) #dclose { display: block; }
#dopen { position: fixed; right: 0; top: 45%; z-index: 10; display: none; background: var(--panel); border: 1px solid var(--line); border-right: 0; color: var(--muted); border-radius: 6px 0 0 6px; padding: 10px 4px; cursor: pointer; font: inherit; writing-mode: vertical-rl; }
body.dclosed.dhas #dopen { display: block; }
/* 劇情流程圖 */
.ftools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 2px 0 8px; font-size: 12px; }
.ftools button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 0 10px; cursor: pointer; font: inherit; }
.ftools button.on { color: var(--text); border-color: var(--accent); }
.ftools .sp { margin-left: auto; color: var(--muted); }
.fwrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,.12); }
.flow { position: relative; }
.flow svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.flow .fe { fill: none; stroke: #5d5664; stroke-width: 1.3; }
.flow .fe.hl { stroke: var(--accent); stroke-width: 2.2; }
.fn { position: absolute; height: 24px; line-height: 22px; padding: 0 8px; background: var(--card, #2a2630); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.fn:hover { border-color: #8a8290; }
.fn small { color: var(--muted); margin-left: 6px; font-size: 11.5px; }
.fn.root { background: #3a2a22; border-color: var(--accent); font-weight: 700; }
.fn.br { background: #262229; }
.fn.chain { background: #2c2636; border-color: #7a6290; }
.fn.ext { border-style: dashed; border-color: #6a7a9a; color: #b9c6e2; }
.fn.ref { border-style: dotted; color: var(--muted); }
.fn.end { border-color: #8a4a4a; color: #e0a0a0; }
.fn.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(233,135,91,.3); }
.fn.fdim { opacity: .35; }
.fn.hl { border-color: var(--accent); }
/* 點流程圖格子的說明：固定在右側欄下緣，捲動時也看得到 */
.fdrawer { position: sticky; bottom: 0; z-index: 2; max-height: 42vh; overflow: auto; margin-top: 8px; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; background: linear-gradient(rgba(233,135,91,.05), rgba(233,135,91,.05)), var(--panel); box-shadow: 0 -6px 16px rgba(0,0,0,.3); }
.fdrawer .fpath { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.timehead { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.yearcell, .monthcell { position: absolute; font-size: 12px; text-align: center; white-space: nowrap; }
.yearcell { top: 0; height: 20px; color: var(--year); font-weight: 700; border-left: 1px solid var(--line); text-align: left; padding-left: 6px; }
.monthcell { top: 20px; height: 22px; color: var(--muted); border-left: 1px solid var(--grid); cursor: pointer; }
.monthcell:hover { color: var(--accent); background: var(--chip); }
.vline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.vline.year { background: var(--line); }
.section { position: absolute; left: 0; font-size: 12px; font-weight: 700; color: var(--muted); padding-left: 8px; letter-spacing: .1em; }
.node { position: absolute; height: 26px; border-radius: 6px; background: var(--node); border: 1px solid var(--line); border-left-width: 4px; font-size: 12px; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.node.main { background: var(--main); }
.node.r-read { border-left-color: var(--read); }
.node.r-part { border-left-color: var(--part); }
.node.r-unread { border-left-color: var(--unread); color: var(--muted); }
.track { position: absolute; height: 2px; background: var(--line); border-radius: 1px; }
.track::after { content: ''; position: absolute; right: -1px; top: -3px; width: 2px; height: 8px; background: var(--line); }
.node.sel { outline: 2px solid var(--sel); z-index: 3; }
.node.rel { outline: 2px dashed var(--accent); z-index: 2; }
.node.dim { opacity: .18; }
.node .ic { margin-right: 3px; }
#links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
#links path { fill: none; stroke: var(--accent); stroke-width: 1.6; opacity: .8; }
.untimed { position: absolute; left: 8px; }
#detail h2 { font-size: 16px; margin: 0 0 4px; }
#detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#detail h3 { font-size: 13px; margin: 16px 0 6px; color: var(--year); letter-spacing: .08em; }
.chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 12px; }
.chip.link { cursor: pointer; text-decoration: underline dotted; }
.cond { padding: 5px 8px; border-left: 3px solid var(--year); background: var(--chip); border-radius: 0 6px 6px 0; margin-bottom: 5px; font-size: 13px; }
.flag { cursor: pointer; text-decoration: underline dotted; color: var(--accent); }
.script { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; padding: 7px 9px; }
.script > .sname { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.legendtxt { font-size: 13px; margin: 5px 0; white-space: pre-wrap; }
.legendtxt details { margin-top: 2px; }
.legendtxt summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
.legendtxt summary::-webkit-details-marker { display: none; }
.legendtxt details[open] summary { display: none; }
.branch { margin: 6px 0 6px 4px; border-left: 2px solid var(--line); padding-left: 8px; }
.bkind { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.opt { margin: 5px 0; }
.opt > .olabel { font-weight: 700; font-size: 13px; }
.opt > .olabel .pct { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }
.rmk { display: inline-block; width: 1.3em; font-weight: 400; }
.rmk.ok { color: #5fbf86; } .rmk.part { color: #e2b04a; } .rmk.no { color: var(--muted); }
.script.tiny { padding: 2px 10px; border-style: dashed; }
.script.tiny .sname { margin: 0; }
.hubnote { font-size: 12.5px; background: rgba(233,135,91,.08); border-left: 3px solid var(--accent); padding: 5px 10px; border-radius: 4px; margin: 4px 0 8px; }
.hubneed { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
.out { font-size: 12px; color: var(--muted); }
.out b { color: var(--ink); font-weight: 600; }
.spoil .unreadtxt { filter: blur(5px); cursor: pointer; transition: filter .15s; }
.spoil .unreadtxt.reveal { filter: none; }
.empty { color: var(--muted); font-size: 13px; }
.note { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px; margin-top: 12px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tabs button { background: transparent; color: var(--ink); border: 0; padding: 5px 14px; font: inherit; cursor: pointer; }
.tabs button.on { background: var(--accent); color: #fff; }
#romance { flex: 1; overflow: auto; padding: 16px 20px 60px; display: none; }
body.view-romance #romance { display: block; }
body.view-romance #chart { display: none; }
body.view-romance .chartonly { display: none; }
.rintro { color: var(--muted); font-size: 13px; max-width: 900px; margin-bottom: 14px; }
.hcard { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 16px; margin-bottom: 14px; max-width: 980px; }
.hcard h2 { margin: 0 0 6px; font-size: 18px; }
.hcard h2 .tag { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.flag.tag { font-size: 11px; color: var(--muted); margin-left: 2px; }
.lv { font-style: normal; font-weight: 700; margin-right: 2px; }
.lv.ok { color: var(--read); }
.lv.no { color: #d9534f; }
.hcard h4 { margin: 12px 0 4px; font-size: 13px; color: var(--year); letter-spacing: .08em; }
.pt { border-left: 3px solid var(--line); padding: 4px 10px; margin: 6px 0; font-size: 13px; }
.pt.bond { border-left-color: var(--read); }
.pt.lose { border-left-color: var(--accent); }
.pt .when { color: var(--muted); font-size: 12px; }
.pt .path { margin: 3px 0 0 0; padding-left: 18px; }
.pt .path li { margin: 1px 0; }
.pt .entry { margin-top: 4px; font-size: 12px; }
.route { margin: 6px 0 4px; padding-left: 24px; font-size: 13px; }
.guide { margin: 6px 0 8px; padding-left: 24px; font-size: 14px; line-height: 1.7; }
.guide ul { padding-left: 20px; margin: 2px 0; }
.guide li::marker { color: var(--year); font-weight: 700; }
.guide .anyhint { color: var(--muted); font-size: 12px; margin-left: 4px; }
.autodetail { margin-top: 6px; }
.libtools { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
/* 橫向篩選：一列選項，選中的反白 */
.fchips { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.fchips > span { color: var(--muted); margin-right: 4px; }
.fchips button { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); color: var(--ink); border: 1px solid transparent; border-radius: 14px; padding: 3px 10px; font: inherit; cursor: pointer; }
.fchips button.on { background: var(--accent); color: #fff; }
.fchips button img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; margin: -2px 0 -2px -6px; background: var(--panel); }
.plcard { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px 14px; margin-bottom: 12px; max-width: 980px; }
.plcard h2 { margin: 0 0 4px; font-size: 17px; }
.plcard h4 { margin: 10px 0 4px; font-size: 13px; color: var(--year); letter-spacing: .06em; }
.plev { border-left: 3px solid var(--line); padding: 4px 10px; margin: 5px 0; font-size: 13px; cursor: pointer; }
.plev:hover { border-left-color: var(--accent); }
.plev .ttl { font-weight: 700; }
.plev .who { color: var(--accent); margin-left: 6px; font-size: 12px; }
.plev .need { color: var(--muted); font-size: 12px; }
.rd { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 4px; margin-right: 4px; }
.rd.r-read { background: var(--read); color: #fff; }
.rd.r-part { background: var(--part); color: #fff; }
.rd.r-unread { background: var(--chip); color: var(--muted); }
.plev .bad, .plev .bad .flag { color: #d9534f; font-weight: 700; }
.plev .live { color: var(--read); font-weight: 700; }
.routes { margin: 2px 0 0 0; padding-left: 22px; }
.tabs .extra { display: none; }
body.moretabs .tabs .extra { display: inline-block; }
.rtag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 9px; font-size: 12px; font-weight: 400; background: #6b3fa0; color: #fff; }
.curev { margin: 0 0 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; }
.steps { margin: 2px 0 0 0; padding-left: 22px; }
.steps li { margin: 1px 0; }
.steps .or { color: var(--accent); font-weight: 700; }
/* 事件劇情樹：分支底下接著的段落縮排、左邊一條線 */
.tkids { margin: 6px 0 2px 2px; padding-left: 10px; border-left: 2px solid var(--accent); }
.tkids > .script { margin-top: 6px; }
.tref { font-size: 12px; color: var(--muted); margin: 4px 0; }
.script .sname b { color: var(--accent); margin-right: 6px; }
.script .sname .pct { margin-right: 6px; }
.script.flash, .plev.flash, .plcard.flash, .subev.flash { outline: 2px solid var(--accent); }
.facts { display: grid; grid-template-columns: 34px 1fr; gap: 1px 8px; font-size: 12.5px; margin: 2px 0 6px; }
.facts .k, .places .k { color: var(--muted); }
.facts .need { font-size: 12.5px; }
.places { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; margin: 2px 0 6px; }
.places .k { width: 34px; }
.places .pl { border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--chip); }
.places .pl small { color: var(--muted); }
.tagx { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 400; }
.subev { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 4px; }
.subhead { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
details.more summary { cursor: pointer; }
.cur { color: var(--muted); font-size: 11.5px; }
.maybe { color: var(--part); font-size: 11.5px; margin-left: 3px; }
.rtag.maybe { border-color: var(--part); }
.golink { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.golink:hover { color: var(--accent); }
.script > .sname { justify-content: flex-start; gap: 4px; }
.forcebtn { float: right; background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 1px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.forcebtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.plev .multi { display: inline-block; background: var(--accent); color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; margin-left: 6px; }
.live { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--chip); color: var(--muted); }
.live.on { background: #2e5c3e; color: #d9f2df; }
.ck { display: inline-block; width: 18px; font-weight: 700; }
.ck.ok { color: var(--read); }
.ck.no { color: var(--unread); }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .7; z-index: 4; pointer-events: none; }
.tmlist button { margin: 3px 6px 3px 0; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; font: inherit; }
.tmlist button:hover { border-color: var(--accent); }
.autodetail > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.route li { margin: 0 0 10px; padding-left: 4px; }
.route li::marker { color: var(--year); font-weight: 700; }
.route li.final { color: var(--ink); }
.route .gain { color: var(--read); font-size: 12px; margin-top: 2px; }
.route li.final .gain { color: var(--accent); font-weight: 700; }
.pt .entry .lbl { color: var(--muted); }
.stime { display: none; color: var(--year); font-size: 11px; margin-left: 6px; }
body.show-time .stime { display: inline; }
#flagpop { position: fixed; z-index: 20; max-width: 380px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 12px; display: none; }
#flagpop .row { margin: 3px 0; cursor: pointer; }
#flagpop .row:hover { color: var(--accent); }

<body class="spoil dclosed">

  <span class="legend"><span><i style="background:var(--read)"></i>已讀</span><span><i style="background:var(--part)"></i>部分</span><span><i style="background:var(--unread)"></i>未讀</span><span>◆ 有選項　📍 指定地點　⚑ 有條件　🏆 有要成就解鎖的劇情　🖼 結緣結局</span></span>

<script id="data" type="application/json">__DATA__</script>
<script id="guides" type="application/json">__GUIDES__</script>
<script id="i18n" type="application/json">__I18N__</script>
<script>
(() => {
  // ---- 多語言：T('原文', 參數…) 查 i18n/strings.json 的對照（render_preview 只放有改過或有翻譯的），{0}{1}… 換成參數 ----
  // 語言：網址 ?lang=ja、或說明頁選的（記在瀏覽器），預設繁中
  const I18N = JSON.parse(document.getElementById('i18n').textContent || '{}');
  const LANG = (() => {
    const q = location.search.match(/[?&]lang=([\w-]+)/);
    if (q) return q[1];
    try { return JSON.parse(localStorage.getItem('wukuai.prefs') || '{}').lang || 'zh-TW'; } catch (e) { return 'zh-TW'; }
  })();
  function T(k, ...a) {
    const e = I18N[k];
    const s = (e && (e[LANG] || e['zh-TW'])) || k;
    return a.length ? s.replace(/\{(\d+)\}/g, (m, i) => String(a[i])) : s;
  }
  // 頁面固定的文字（標題列、分頁名、圖例）：載入時換一次
  (function i18nStatic(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) continue;
      const t = n.nodeValue.trim();
      if (t && I18N[t]) n.nodeValue = n.nodeValue.replace(t, T(t));
    }
    root.querySelectorAll('[title],[placeholder]').forEach(el => ['title', 'placeholder'].forEach(at => { const v = el.getAttribute(at); if (v && I18N[v]) el.setAttribute(at, T(v)); }));
  })(document.body);
  const G = JSON.parse(document.getElementById('data').textContent);
  const GUIDES = JSON.parse(document.getElementById('guides').textContent);
  // 比對網頁自己產生的文字：選項／戰鬥結果在產生時記下，句型取 {0} 前面那段
  const CHOICE_NAME = new Map(), CHOICE_LABEL = new Map(), BATTLE_TEXTS = new Set();
  const tHead = k => T(k).split('{0}')[0];
  const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const needTail = () => { const [a, b = ''] = T("（需 {0}）").split('{0}'); return new RegExp(escRe(a) + '.*' + escRe(b) + '$'); };
  let LIVE = null;
  const ONLINE = location.protocol.startsWith('http');
  function liveValue(kind, key) {
    if (!LIVE || !LIVE.inGame) return null;
    const table = {flag: LIVE.flags, stat: LIVE.stats, rel: LIVE.rel, talent: LIVE.talents}[kind] || {};
    return table[key] ?? 0;
  }
  // check 語法：flag:M50017=1、rel:sister1>=60、stat:training<=40、talent:2101>=5；& 且、| 或
  function evalCheck(expr) {
    if (!expr || !LIVE || !LIVE.inGame) return null;
    return expr.split('|').some(group => group.split('&').every(atom => {
      const m = atom.trim().match(/^(flag|stat|rel|talent):(.+?)(>=|<=|!=|=|>|<)(-?\d+)$/);
      if (!m) return false;
      const v = liveValue(m[1], m[2]), n = Number(m[4]);
      return {'>=': v >= n, '<=': v <= n, '!=': v !== n, '=': v === n, '>': v > n, '<': v < n}[m[3]];
    }));
  }
  function checkMark(expr) {
    const r = evalCheck(expr);
    return r === null ? '' : `<span class="ck ${r ? 'ok' : 'no'}" title="${r ? T("目前已符合") : T("目前尚未符合")}">${r ? '✓' : '✗'}</span>`;
  }
  let currentView = 'chart';
  let LIVE_POS = null, LIVE_FORCED = new Set();
  // 篩選器狀態記在瀏覽器（Mod 網頁每次都是同一個網址，關掉再開也會留著）；讀寫失敗就當沒記
  const PREFS = (() => { try { return JSON.parse(localStorage.getItem('wukuai.prefs') || '{}') || {}; } catch (e) { return {}; } })();
  function savePref(k, v) { PREFS[k] = v; try { localStorage.setItem('wukuai.prefs', JSON.stringify(PREFS)); } catch (e) { } }
  let lastSig = null;
  // 遊戲目前的已讀紀錄：第一次全部抓，之後只抓新增的；有變就重算五塊錢、地點事件、流程圖的已讀
  const LIVE_READ = new Set();
  let liveReadCount = 0;
  // 台詞樹（k 一定要讀、g 差分組）從分支樹推出來：和 build_graph 的 text_tree 同一套
  function ktOf(node) {
    const t = {k: node.k.slice(), g: []};
    for (const s of node.sub || []) {
      const subs = s.br.map(ktOf);
      if (s.v) { const alts = subs.filter(x => x.k.length || x.g.length); if (alts.length) t.g.push(alts); }
      else subs.forEach(x => { t.k.push(...x.k); t.g.push(...x.g); });
    }
    return t;
  }
  G.unread.forEach(u => { u.kt = ktOf(u.rt); });
  // ---- 「怎麼看到沒讀的台詞」：照 build_graph 的 unread_reasons，用遊戲目前的已讀即時算 ----
  const liveRatio = (keys, kp) => { const s = new Set(keys); if (!s.size) return null; let n = 0; s.forEach(k => { if (LIVE_READ.has(kp + k)) n++; }); return n / s.size; };
  // 分支實際要讀的台詞：差分組只算讀得最多的版本（同分取短的）；all＝每個版本都算
  function effKeys(b, kp, all) {
    let ks = b.k.slice();
    for (const s of b.sub || []) {
      if (s.v && !all) { const best = bestAlt(s, kp); if (best) ks = ks.concat(effKeys(best, kp, false)); }
      else s.br.forEach(a => { ks = ks.concat(effKeys(a, kp, all)); });
    }
    return ks;
  }
  function bestAlt(s, kp) {
    let best = null, br = -1, bl = 0;
    for (const a of s.br) {
      const t = effKeys(a, kp, false), r = liveRatio(t, kp) || 0;
      if (!best || r > br || (r === br && -t.length > bl)) { best = a; br = r; bl = -t.length; }
    }
    return best;
  }
  // 台詞 → 算誰的（u.who 是 角色 → 台詞）
  function keyHeroines(u) {
    if (!u._kh) { u._kh = new Map(); for (const [h, ks] of Object.entries(u.who || {})) ks.forEach(k => { if (!u._kh.has(k)) u._kh.set(k, []); u._kh.get(k).push(h); }); }
    return u._kh;
  }
  function liveReasons(u) {
    if (u._rsAt === liveReadCount) return u._rs;
    const kp = u.kp, kh = keyHeroines(u), out = [];
    const push = (b, kind, path, t, whoKeys, variant) => {
      if (b.n || path.slice(-3).some(p => p.n)) return;
      out.push({kind, label: b.d || b.l, path: path.slice(-3).map(p => p.l), lines: new Set(t).size,
        heroines: [...new Set(whoKeys.flatMap(k => kh.get(k) || []))].sort(), ...(variant ? {variant: true} : {})});
    };
    const walk = (node, path, variant) => {
      for (const s of node.sub || []) {
        if (s.v) {
          // 差分：讀得最多的版本照常往下找；其他版本整段沒讀的標成差分
          const best = bestAlt(s, kp);
          if (best) walk(best, path, variant);
          for (const b of s.br) {
            if (b === best) continue;
            const all = effKeys(b, kp, true), r = liveRatio(all, kp);
            if (r === 0) push(b, 'variant', path, effKeys(b, kp, false), all, true);
            else if (r != null && r < 1) walk(b, path.concat([b]), true);
          }
          continue;
        }
        for (const b of s.br) {
          if (b.x) continue;
          const t = effKeys(b, kp, false), r = liveRatio(t, kp);
          if (r == null) continue;
          if (r === 0) push(b, s.kind, path, t, t, variant);
          else if (r < 1) walk(b, path.concat([b]), variant);
        }
      }
    };
    walk(u.rt, [], false);
    u._rsAt = liveReadCount;
    return (u._rs = out.slice(0, 12));
  }
  async function syncRead() {
    let j;
    try { j = await (await fetch(`/api/readkeys?from=${liveReadCount}`, {cache: 'no-store'})).json(); } catch (e) { return false; }
    if (!j || j.count == null || !j.count) return false;
    if (j.reset) { LIVE_READ.clear(); }
    j.keys.forEach(k => LIVE_READ.add(k));
    const changed = j.keys.length > 0;
    liveReadCount = j.count;
    if (!changed) return false;
    for (const u of G.unread) {
      const ratio = keys => { const k = [...new Set(keys)]; return k.length ? k.filter(x => LIVE_READ.has(x)).length / k.length : 1; };
      u.readOff = ratio(treeKeys(u.kt, u.kp, false));
      u.readAll = ratio(treeKeys(u.kt, u.kp, true));
      const sc = G.scripts[u.s];
      if (sc) { sc._off = u.readOff; sc.readAll = u.readAll; }
    }
    G.positions.forEach(p => p.layers.forEach(L => L.candidates.forEach(c => {
      const u = G.unread.find(x => x.s === (c.rs || c.script));
      if (u) { c._off = u.readOff; c.readAll = u.readAll; }
    })));
    applyDiffMode();
    return true;
  }
  // 差分（屬性換台詞）：不列入時每組取讀得最多的版本，列入時每個版本都算
  function treeKeys(node, kp, all) {
    let keys = (node.k || []).map(k => kp + k);
    for (const grp of node.g || []) {
      if (all) grp.forEach(a => { keys = keys.concat(treeKeys(a, kp, true)); });
      else {
        const alts = grp.map(a => [...new Set(treeKeys(a, kp, false))]);
        const score = ks => ks.length ? ks.filter(k => LIVE_READ.has(k)).length / ks.length : 0;
        keys = keys.concat(alts.reduce((b, a) => score(a) > score(b) || (score(a) === score(b) && a.length < b.length) ? a : b));
      }
    }
    return keys;
  }
  const diffOn = () => !!document.getElementById('diffOn')?.checked;
  function applyDiffMode() {
    const on = diffOn();
    G.unread.forEach(u => { if (u.readOff == null) u.readOff = u.read; u.read = on ? u.readAll : u.readOff; });
    Object.values(G.scripts).forEach(sc => { if (sc._off == null) sc._off = sc.read; sc.read = on && sc.readAll != null ? sc.readAll : sc._off; });
    G.positions.forEach(p => p.layers.forEach(L => L.candidates.forEach(c => { if (c._off == null) c._off = c.read; c.read = on && c.readAll != null ? c.readAll : c._off; })));
    G.events.forEach(e => e._read = eventRead(e));
  }
  async function poll() {
    if (!ONLINE) return;
    const readChanged = LIVE && LIVE.live ? await syncRead() : false;
    if (readChanged) statsText();
    try {
      const res = await fetch('/api/state', {cache: 'no-store'});
      LIVE = await res.json();
    } catch (e) {
      LIVE = null;
    }
    const badge = document.getElementById('live');
    if (LIVE && LIVE.inGame && LIVE.time) {
      badge.className = 'live on';
      badge.textContent = T("● 已連線：第{0}年{1}月{2}", LIVE.time.y, LIVE.time.m, STAGE[LIVE.time.s]);
    } else if (LIVE && LIVE.live) {
      badge.className = 'live on';
      badge.textContent = T("● 已連線（標題畫面）");
    } else {
      badge.className = 'live';
      badge.textContent = T("未連線");
    }
    // 狀態沒變就不重畫，避免展開的區塊被收起
    const sig = LIVE ? JSON.stringify([LIVE.time, LIVE.flags, LIVE.stats, LIVE.rel, LIVE.talents, LIVE.recent]) : '';
    if (sig === lastSig && !readChanged) return;
    lastSig = sig;
    if (currentView === 'unread') renderUnread(true);
    if (readChanged && currentView === 'chart') layout();
    if (ONLINE && currentView === 'places') {
      try { const pj = await (await fetch('/api/positions', {cache: 'no-store'})).json(); LIVE_POS = pj.groups; LIVE_FORCED = new Set(pj.forced || []); } catch (e) { LIVE_POS = null; }
    }
    if (currentView === 'romance') renderRomance(true);
    else if (currentView === 'targets') renderTargets(true);
    else if (currentView === 'places') renderPlaces(true);
    else if (currentView === 'help') renderHelp(true);
    else drawNowLine();
  }
  function drawNowLine() {
    canvas.querySelectorAll('.nowline').forEach(n => n.remove());
    if (!LIVE || !LIVE.inGame || !LIVE.time) return;
    const i = idx(LIVE.time);
    if (i < minI || i > maxI) return;
    const line = document.createElement('div'); line.className = 'nowline';
    line.style.left = (xOf(i) + SLOT / 2) + 'px'; line.title = T("目前時間");
    canvas.appendChild(line);
  }
  const SLOT = 30, MONTH = SLOT * 3, LEFT = 150, NODE_W = 132, ROW = 32, HEAD = 46;
  const STAGE = ['', T("上旬"), T("中旬"), T("下旬")];
  const idx = t => ((t.y - 1) * 12 + (t.m - 1)) * 3 + (t.s - 1);
  const valid = t => t && t.y >= 1 && t.m >= 1 && t.m <= 12 && t.s >= 1 && t.s <= 3;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tstr = t => T("第{0}年{1}月{2}", t.y, t.m, STAGE[t.s]);

  const byId = new Map(G.events.map(e => [e.id.toLowerCase(), e]));
  const SHOWN = G.events.filter(e => !e.quiet);
  const scriptOwner = new Map();
  G.events.forEach(e => e.scripts.forEach(sc => { if (!scriptOwner.has(sc)) scriptOwner.set(sc, e.id.toLowerCase()); }));
  const byStart = new Map();
  G.events.forEach(e => { if (e.start && !byStart.has(e.start)) byStart.set(e.start, e); });

  // 事件的整體已讀度、是否有選項、往後觸發的任務
  function walkItems(items, fn, path = []) {
    for (const it of items || []) {
      fn(it, path);
      if (it.t === 'branch') it.branches.forEach(b => walkItems(b.items, fn, path.concat(b.label)));
    }
  }
  function eventRead(e) {
    let lines = 0, readSum = 0;
    e.scripts.forEach(s => { const info = G.scripts[s]; if (info && info.read != null) { lines += info.lines; readSum += info.read * info.lines; } });
    return lines ? readSum / lines : null;
  }
  G.events.forEach(e => {
    let choice = false; const triggers = new Set();
    e.scripts.forEach(s => {
      const info = G.scripts[s]; if (!info) return;
      walkItems(info.items, it => {
        if (it.t === 'branch' && it.kind === 'choice') choice = true;
        if (it.t === 'mission') triggers.add(`${it.m}/${it.k}`.toLowerCase());
      });
    });
    e._read = eventRead(e);
    e._choice = choice;
    e._triggers = [...triggers].filter(id => byId.has(id) && id !== e.id.toLowerCase());
  });
  // 長劇情切開的段落：接在前一段後面，也算是前一段「之後會啟動」的
  G.events.forEach(e => (e.partFrom || []).forEach(id => {
    const p = byId.get(id.toLowerCase());
    if (p && !p._triggers.includes(e.id.toLowerCase())) p._triggers.push(e.id.toLowerCase());
  }));
  G.events.forEach(e => e._from = []);
  G.events.forEach(e => e._triggers.forEach(id => byId.get(id)._from.push(e.id.toLowerCase())));
  const partFromHtml = e => e.partFrom.length > 4
    ? T("{0}等 {1} 個事件", e.partFrom.slice(0, 3).map(id => evLink(id.toLowerCase())).join(''), e.partFrom.length)
    : e.partFrom.map(id => evLink(id.toLowerCase())).join(T("或"));

  // 時間範圍
  let minI = Infinity, maxI = -Infinity;
  G.events.forEach(e => {
    if (!e.time || e.time.type === 'period' || !valid(e.time.from)) return;
    minI = Math.min(minI, idx(e.time.from));
    maxI = Math.max(maxI, idx(e.time.type === 'range' && valid(e.time.to) ? e.time.to : e.time.from));
  });
  minI -= minI % 3; maxI += 3 - (maxI % 3);
  const xOf = i => LEFT + (i - minI) * SLOT;

  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('links');
  const detail = document.getElementById('detail');
  const nodes = new Map();

  const LIB_ICON = {end: '📜', cg: '🖼', dead: '💀'};
  const LIB_NAME = {end: T("汗青書"), cg: T("結緣結局"), dead: T("死法")};
  // 汗青書、死法的達成方式看 smilin.net wiki，這裡只留結緣結局
  const cgLibs = e => (e.libs || []).filter(id => G.library[id]?.kind === 'cg');
  function libIcons(e) {
    return cgLibs(e).length ? `<span class="ic">${LIB_ICON.cg}</span>` : '';
  }
  function libGot(id) {
    if (LIVE && LIVE.lib) return (LIVE.lib[id] || 0) > 0;
    return (G.library[id]?.got || 0) > 0;
  }
  // 圖鑑項目連結：沒取得的名稱在防雷模式下模糊
  function libLink(id) {
    const item = G.library[id];
    if (!item) return esc(id);
    return `<span class="chip link" data-lib="${esc(id)}">${LIB_ICON[item.kind]} ${LIB_NAME[item.kind]}「<span class="${libGot(id) ? '' : 'unreadtxt'}">${esc(item.title)}</span>」</span>`;
  }
  function readClass(r) { return r == null ? 'r-unread' : r >= 0.95 ? 'r-read' : r > 0 ? 'r-part' : 'r-unread'; }
  function label(e) {
    const t = e.desc ? e.desc.slice(0, 14) : e.title ? e.title.slice(0, 14) : (e.start || e.key);
    return `${e._choice ? '<span class="ic">◆</span>' : ''}${e.achieve ? '<span class="ic">🏆</span>' : ''}${e.pos ? '<span class="ic">📍</span>' : ''}${e.conds.length ? '<span class="ic">⚑</span>' : ''}${libIcons(e)}${esc(t)}`;
  }

  // ---------- 分段的直式時間軸 ----------
  // 依劇本章節（ch1～ch8）分段；事件放在最早可能發生的那一旬，期間型的事件寫出期間
  // 第2年2月～11月分成三條留學線（同一個事件可能在好幾條線都有）
  const ARCS = [
    {name: T("入門"), from: [1, 4], to: [1, 9]}, {name: T("南宮壽宴"), from: [1, 10], to: [2, 1]},
    {name: '不留學', from: [2, 2], to: [2, 11], study: '不留學', note: T("一直留在唐門")},
    {name: T("崆峒留學"), from: [2, 2], to: [2, 11], study: '崆峒', note: T("崆峒，8月起江陵")},
    {name: T("青城留學"), from: [2, 2], to: [2, 11], study: '青城', note: T("8月上旬前在唐門，8月中旬起青城")},
    {name: T("唐門內戰・臥雲崗"), from: [2, 12], to: [3, 2]}, {name: T("小師妹招親"), from: [3, 3], to: [3, 5]},
    {name: T("雪山・武林大會"), from: [3, 6], to: [3, 10]}, {name: T("決策"), from: [3, 11], to: [4, 2]}, {name: T("終局"), from: [4, 3], to: [4, 12]},
  ];
  let arcSel = PREFS.arc != null && (PREFS.arc === '' || PREFS.arc === T("時間不定") || ARCS.some(a => a.name === PREFS.arc)) ? PREFS.arc : T("入門");
  let castSel = PREFS.cast || '';
  const mIdx = (y, m) => y * 12 + m;
  function inArc(e, name) {
    const t = e.time;
    if (!t || t.type === 'period' || !valid(t.from)) return name === T("時間不定");
    const a = ARCS.find(x => x.name === name);
    if (!a) return false;
    const k = mIdx(t.from.y, t.from.m);
    return k >= mIdx(...a.from) && k <= mIdx(...a.to) && (!a.study || !e.study || e.study.includes(a.study));
  }
  // 有分線的事件優先放在自己那條線
  const arcOf = e => [T("時間不定"), ...ARCS.filter(a => e.study && e.study.includes(a.study)).map(a => a.name), ...ARCS.map(a => a.name)].find(n => inArc(e, n)) || T("時間不定");
  // 角色篩選（同五塊錢）：事件裡有她說話、立繪、傳說或旁白提到
  const castHit = e => !castSel || (castSel === '__none' ? !(e.cast || []).some(shownName) : (e.cast || []).includes(castSel));
  // 從別處跳到某個事件：分段模式就切到那個事件所在的段落再捲過去
  function revealEvent(id) {
    const e = byId.get(id);
    if (arcSel && e) {
      if (!inArc(e, arcSel)) { arcSel = arcOf(e); savePref('arc', arcSel); }
      if (!castHit(e)) { castSel = ''; savePref('cast', ''); }
      layout();
      select(id, true);
      document.querySelector(`#arcview [data-arc-ev="${CSS.escape(id)}"]`)?.scrollIntoView({block: 'center'});
      return;
    }
    select(id, true);
    nodes.get(id)?.scrollIntoView({block: 'center', inline: 'center'});
  }
  function cardHtml(e) {
    const r = e._read;
    const cls = r == null ? 'none' : r >= 0.999 ? 'read' : r > 0 ? 'part' : '';
    const t = e.time;
    const range = t && t.type === 'range' ? whenText(e) : t && t.type === 'period' ? T("每月{0}", STAGE[t.stage]) : '';
    const how = e.pos ? T("📍到「{0}」", e.pos) : e.part ? T("接續前一段") : '';
    const pct = r == null ? T("無對話") : r >= 0.999 ? T("已讀") : r > 0 ? `${Math.round(r * 100)}%` : T("未讀");
    return `<div class="acard ${cls}${selected === e.id.toLowerCase() ? ' sel' : ''}" data-arc-ev="${esc(e.id.toLowerCase())}">`
      + `<div>${e.main ? T("<span class=\"mainmark\">主線</span>") : ''}${label(e)}</div>`
      + `<div class="am">${pct}${range ? '　' + esc(range) : ''}${how ? '　' + esc(how) : ''}${routeTag(e)}</div></div>`;
  }
  function renderArcBar() {
    loadIcons();
    const bar = document.getElementById('arcbar');
    const chip = (attr, v, cur, text) => `<button data-${attr}="${esc(v)}"${v === cur ? ' class="on"' : ''}>${text}</button>`;
    const names = [...new Set(SHOWN.flatMap(e => e.cast || []))].filter(shownName).sort();
    bar.innerHTML = T("<div class=\"fchips\"><span>段落</span>{0}", ARCS.map(a => chip('arc', a.name, arcSel, T("{0}<small>{1}年{2}月～</small>", esc(a.name), a.from[0], a.from[1]))).join(''))
      + `${chip('arc', T("時間不定"), arcSel, T("時間不定"))}${chip('arc', '', arcSel, T("全部（大圖）"))}</div>`
      + T("<div class=\"fchips\"><span>角色</span>{0}{1}{2}</div>", chip('cast', '', castSel, T("全部")), names.map(n => chip('cast', n, castSel, iconImg(n) + esc(n))).join(''), chip('cast', '__none', castSel, T("其他")));
    bar.querySelectorAll('[data-arc]').forEach(b => b.onclick = () => { arcSel = b.dataset.arc; savePref('arc', arcSel); layout(); });
    bar.querySelectorAll('[data-cast]').forEach(b => b.onclick = () => { castSel = b.dataset.cast; savePref('cast', castSel); layout(); });
  }
  function renderArc() {
    const view = document.getElementById('arcview');
    const onlyChoice = document.getElementById('onlyChoice').checked;
    const show = e => !e.quiet && !e.meeting && (!onlyChoice || e._choice) && castHit(e);
    const list = SHOWN.filter(e => show(e) && inArc(e, arcSel));
    const a = ARCS.find(x => x.name === arcSel);
    let html = `<h2 class="ahead">${esc(arcSel)}${a ? T("<span>　第{0}年{1}月～第{2}年{3}月{4}</span>", a.from[0], a.from[1], a.to[0], a.to[1], a.note ? '　·　' + esc(a.note) : '') : T("<span>　沒有固定時間：到地點或條件符合就觸發、每月固定時間</span>")}</h2>`;
    const byPlace = evs => {
      const g = new Map();
      evs.forEach(e => { const p = e.place || T("旅途／其他"); if (!g.has(p)) g.set(p, []); g.get(p).push(e); });
      return [...g.entries()].map(([p, xs]) => `<div class="acol"><div class="apl">${esc(p)}</div>${xs.map(cardHtml).join('')}</div>`).join('');
    };
    if (a) {
      const now = LIVE && LIVE.inGame && LIVE.time ? [LIVE.time.y, LIVE.time.m, LIVE.time.s].join('-') : '';
      for (let k = mIdx(...a.from); k <= mIdx(...a.to); k++) {
        const y = Math.floor((k - 1) / 12), m = (k - 1) % 12 + 1;
        for (let st = 1; st <= 3; st++) {
          const evs = list.filter(e => e.time.from.y === y && e.time.from.m === m && e.time.from.s === st);
          html += T("<div class=\"arow{0}{1}\"><div class=\"awhen\" data-arc-month=\"{2}-{3}\" title=\"遊戲內點這裡會讀取該月的時光機存檔\"><b>第{4}年{5}月</b>{6}</div><div class=\"acells\">{7}</div></div>", evs.length ? '' : ' empty', now === `${y}-${m}-${st}` ? ' now' : '', y, m, y, m, STAGE[st], evs.length ? byPlace(evs) : '—');
        }
      }
    } else {
      html += `<div class="arow"><div class="awhen">　</div><div class="acells">${list.length ? byPlace(list) : '—'}</div></div>`;
    }
    view.innerHTML = html;
    applyFilter();
  }
  document.getElementById('arcview').addEventListener('click', ev => {
    const c = ev.target.closest('[data-arc-ev]');
    if (c) {
      document.querySelectorAll('#arcview .acard.sel').forEach(x => x.classList.remove('sel'));
      c.classList.add('sel');
      select(c.dataset.arcEv, true);
      return;
    }
    const mo = ev.target.closest('[data-arc-month]');
    if (mo) {
      const [y, m] = mo.dataset.arcMonth.split('-').map(Number);
      document.querySelector(`#canvas .monthcell[data-ym="${y}-${m}"]`)?.click();
    }
  });
  function layout() {
    renderArcBar();
    document.body.classList.toggle('arcmode', !!arcSel);
    document.getElementById('arcview').style.display = arcSel ? '' : 'none';
    layoutCanvas();
    if (arcSel) renderArc();
  }
  function layoutCanvas() {
    canvas.querySelectorAll('.node,.track,.section,.vline,.timehead,.untimed').forEach(n => n.remove());
    nodes.clear();
    const groupBy = document.getElementById('groupBy').value;
    const onlyChoice = document.getElementById('onlyChoice').checked;
    const width = xOf(maxI) + NODE_W + 40;

    const head = document.createElement('div');
    head.className = 'timehead'; head.style.width = width + 'px'; head.style.height = HEAD + 'px';
    for (let i = minI; i < maxI; i += 3) {
      const y = Math.floor(i / 36) + 1, m = Math.floor((i % 36) / 3) + 1;
      if (m === 1 || i === minI) {
        const yc = document.createElement('div'); yc.className = 'yearcell';
        yc.style.left = xOf(i) + 'px'; yc.style.width = MONTH * (m === 1 ? 12 : 13 - m) + 'px'; yc.textContent = T("第{0}年", y);
        head.appendChild(yc);
      }
      const mc = document.createElement('div'); mc.className = 'monthcell';
      mc.style.left = xOf(i) + 'px'; mc.style.width = MONTH + 'px'; mc.textContent = T("{0}月", m);
      mc.title = T("{0}年{1}月：遊戲內點這裡會讀取該月的時光機存檔", y, m);
      mc.dataset.ym = `${y}-${m}`;
      head.appendChild(mc);
    }
    canvas.appendChild(head);

    const sections = groupEvents(groupBy);
    let top = HEAD + 10, height = top;
    const untimed = [];
    for (const [name, list] of sections) {
      const sec = document.createElement('div'); sec.className = 'section'; sec.style.top = top + 'px'; sec.textContent = name;
      canvas.appendChild(sec);
      top += 22;
      const rows = []; // 每列已占用區間
      const missionRow = new Map();
      const timed = list.filter(e => e.time && e.time.type !== 'period' && valid(e.time.from) && (!onlyChoice || e._choice));
      timed.sort((a, b) => idx(a.time.from) - idx(b.time.from));
      for (const e of timed) {
        const x0 = xOf(idx(e.time.from));
        const x1 = Math.max(x0 + NODE_W, e.time.type === 'range' && valid(e.time.to) ? xOf(idx(e.time.to) + 1) : 0);
        const fits = r => rows[r].every(([a, b]) => x1 + 6 <= a || x0 >= b + 6);
        let r = missionRow.get(e.mission);
        if (r == null || !fits(r)) {
          r = rows.findIndex((_, k) => fits(k));
          if (r < 0) { rows.push([]); r = rows.length - 1; }
        }
        rows[r].push([x0, x1]); missionRow.set(e.mission, r);
        place(e, x0, top + r * ROW, x1 - x0, e.time.type === 'range');
      }
      list.filter(e => !(e.time && e.time.type !== 'period' && valid(e.time.from)) && (!onlyChoice || e._choice)).forEach(e => untimed.push(e));
      top += Math.max(1, rows.length) * ROW + 18;
      height = top;
    }
    if (untimed.length) {
      const sec = document.createElement('div'); sec.className = 'section'; sec.style.top = top + 'px'; sec.textContent = T("不限時間（條件滿足即觸發）");
      canvas.appendChild(sec); top += 22;
      const perRow = Math.max(1, Math.floor((width - LEFT) / (NODE_W + 8)));
      untimed.forEach((e, k) => place(e, LEFT + (k % perRow) * (NODE_W + 8), top + Math.floor(k / perRow) * ROW, NODE_W, false));
      top += Math.ceil(untimed.length / perRow) * ROW + 18;
      height = top;
    }
    for (let i = minI; i <= maxI; i += 3) {
      const v = document.createElement('div'); v.className = 'vline' + ((Math.floor((i % 36) / 3) === 0) ? ' year' : '');
      v.style.left = xOf(i) + 'px'; canvas.appendChild(v);
    }
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    svg.setAttribute('width', width); svg.setAttribute('height', height);
    applyFilter();
    drawNowLine();
    if (selected) select(selected, false, undefined, true);
  }

  // 結緣線：事件出現在某位女主的結緣步驟裡，或觸發條件看她的好感，就歸到她那一組
  function romanceOwners() {
    const showHidden = document.getElementById('showHidden').checked;
    const owner = new Map();
    const collect = (unit, name) => {
      if (unit.ev && !owner.has(unit.ev.toLowerCase())) owner.set(unit.ev.toLowerCase(), name);
      unit.needs.forEach(n => n.by.forEach(b => collect(b, name)));
    };
    for (const h of G.heroines) {
      if (h.hidden && !showHidden) continue;
      h.routes.forEach(r => collect(r, h.name));
    }
    for (const h of G.heroines) {
      if (h.hidden && !showHidden) continue;
      G.events.forEach(e => {
        const id = e.id.toLowerCase();
        if (!owner.has(id) && e.conds.some(c => c.includes('好感·' + h.name))) owner.set(id, h.name);
      });
    }
    return owner;
  }
  function groupEvents(groupBy) {
    const groups = new Map();
    const add = (name, e) => { if (!groups.has(name)) groups.set(name, []); groups.get(name).push(e); };
    if (groupBy === 'romance') {
      const owner = romanceOwners();
      G.heroines.forEach(h => { if (!h.hidden || document.getElementById('showHidden').checked) groups.set(h.name, []); });
      SHOWN.forEach(e => add(owner.get(e.id.toLowerCase()) || T("其他"), e));
      if (groups.has(T("其他"))) { const other = groups.get(T("其他")); groups.delete(T("其他")); groups.set(T("其他"), other); }
    } else {
      G.places.forEach(name => groups.set(name, []));
      SHOWN.forEach(e => add(e.place || T("旅途／其他"), e));
    }
    return [...groups.entries()].filter(([, list]) => list.length);
  }
  function place(e, x, y, w, range) {
    if (range && w > NODE_W) {
      const tr = document.createElement('div'); tr.className = 'track';
      tr.style.left = (x + NODE_W) + 'px'; tr.style.top = (y + 12) + 'px'; tr.style.width = (w - NODE_W) + 'px';
      tr.title = T("可觸發的時間區間");
      canvas.appendChild(tr);
    }
    const n = document.createElement('div');
    n.className = `node ${e.main ? 'main' : ''} ${readClass(e._read)}`;
    n.style.left = x + 'px'; n.style.top = y + 'px'; n.style.width = NODE_W + 'px';
    n.innerHTML = label(e);
    n.title = `${e.desc ? e.desc + '\n' : ''}${e.title || e.start || e.key}\n${e.mission} / ${e.key}`;
    n.onclick = () => select(e.id.toLowerCase(), true);
    canvas.appendChild(n);
    nodes.set(e.id.toLowerCase(), n);
  }

  // 搜尋
  function haystack(e) {
    if (e._hay) return e._hay;
    const parts = [e.desc, e.devDesc, e.title, e.mission, e.key, e.start, e.pos, ...e.conds, ...e.scripts];
    e.scripts.forEach(s => walkItems(G.scripts[s]?.items, it => { if (it.t === 'branch') it.branches.forEach(b => parts.push(b.label)); }));
    return e._hay = parts.join('\n').toLowerCase();
  }
  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    G.events.forEach(e => { const n = nodes.get(e.id.toLowerCase()); if (n) n.classList.toggle('dim', !!q && !haystack(e).includes(q)); });
    document.querySelectorAll('#arcview .acard').forEach(c => c.classList.toggle('dim', !!q && !haystack(byId.get(c.dataset.arcEv)).includes(q)));
    if (!arcSel && castSel) G.events.forEach(e => { const n = nodes.get(e.id.toLowerCase()); if (n && !castHit(e)) n.classList.add('dim'); });
  }

  // 細節面板
  let selected = null, detailStale = false;
  // quiet：重排、篩選後的重畫，右側欄收起時不要打開它
  function select(id, scroll, focus, quiet) {
    if (id !== selected) navPush({view: currentView, ev: id});
    selected = id;
    const e = byId.get(id);
    nodes.forEach(n => n.classList.remove('sel', 'rel'));
    const rel = new Set([...e._triggers, ...e._from]);
    rel.forEach(r => nodes.get(r)?.classList.add('rel'));
    nodes.get(id)?.classList.add('sel');
    document.querySelectorAll('#arcview .acard').forEach(c => c.classList.toggle('sel', c.dataset.arcEv === id));
    drawLinks(e);
    if (quiet && document.body.classList.contains('dclosed')) detailStale = true;
    else renderDetail(e, focus);
    if (scroll) detail.scrollTop = 0;
  }
  function center(n) { return [n.offsetLeft + n.offsetWidth / 2, n.offsetTop + 13]; }
  function drawLinks(e) {
    svg.innerHTML = '';
    const from = nodes.get(e.id.toLowerCase()); if (!from) return;
    const add = (a, b) => {
      if (!a || !b) return;
      const [x1, y1] = center(a), [x2, y2] = center(b);
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const dx = Math.max(40, Math.abs(x2 - x1) / 2);
      p.setAttribute('d', `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`);
      svg.appendChild(p);
    };
    e._triggers.forEach(t => add(from, nodes.get(t)));
    e._from.forEach(f => add(nodes.get(f), from));
  }

  function evLink(id) {
    const ev = byId.get(id); if (!ev) return `<span class="chip">${esc(id)}</span>`;
    return `<span class="chip link" data-ev="${esc(id)}">${esc((ev.desc || ev.title || ev.start || ev.key).slice(0, 18))}</span>`;
  }
  // 旗標後面若接「比較符號 數值」，一併記下，點開時只列出能滿足這個條件的設定位置
  function condHtml(c) {
    return esc(c).replace(/旗標 ([A-Za-z0-9_]+)((?:（[^）]*）)?)(?: (=|≠|&lt;|≤|&gt;|≥) (-?\d+))?/g, (m, f, alias, op, val) => {
      const attrs = op ? ` data-op="${op}" data-val="${val}"` : '';
      return T("<span class=\"flag\" data-flag=\"{0}\"{1}>旗標 {2}{3}</span>{4}", f, attrs, f, alias, op ? ` ${op} ${val}` : '');
    });
  }
  function satisfies(v, op, val) {
    val = Number(val);
    switch (op) {
      case '=': return v === val;
      case '≠': return v !== val;
      case '&lt;': return v < val;
      case '≤': return v <= val;
      case '&gt;': return v > val;
      case '≥': return v >= val;
      default: return true;
    }
  }
  function entryHtml(x) {
    const ctx = x.ev ? byId.get(x.ev.toLowerCase()) : null;
    const steps = [];
    for (const step of (x.entry || []).slice().reverse()) {
      const opts = [...new Set(step.options.map(o => pathHtml(o.path, ctx, o.from)).filter(Boolean))];
      if (opts.length) steps.push(opts.join(T("<br>或 ")));
    }
    if (x.path && x.path.length) { const t = pathHtml(x.path, ctx, x.s); if (t) steps.push(t); }
    return steps.length ? `<ol class="path">${steps.map(t => `<li>${t}</li>`).join('')}</ol>` : '';
  }
  // 從旗標跳過來時的標題：「怎麼讓「神兵帖進度」= 1」
  const focusHead = f => T("怎麼讓{0}{1}", flagName(f.flag) ? `「${esc(flagName(f.flag))}」` : ` ${esc(f.flag)} `, f.op === 'AddFlag' ? (f.v > 0 ? '+' : '') + f.v : '= ' + f.v);
  // 傳說（劇情摘要原文）先不顯示：資料還在，改 true 就回來
  const SHOW_LEGEND = false;
  function legendBlock(list, hide) {
    return SHOW_LEGEND && list && list.length ? legendHtml(list.join('\n'), hide) : '';
  }
  function legendHtml(text, hide) {
    const paras = String(text).split('\n').filter(x => x.trim());
    const first = paras.shift() || '';
    const rest = paras.length ? T("<details><summary>⋯ 展開其餘 {0} 段</summary>{1}</details>", paras.length, esc(paras.join('\n'))) : '';
    return `<div class="legendtxt${hide}">${esc(first)}${rest}</div>`;
  }
  function unread(r) { return r != null && r < 0.05; }

  // ---- 白話：旗標條件改說成「在哪裡選了什麼」；點有底線的字可看完整來源 ----
  const TEMP_FLAG = /^(C\d|TC\d|A\d|B\d|Talk_Option|BattleResult|Prologue|ActionCheck)/;
  const evShort = ev => {
    const t = (ev.desc || ev.title || ev.key).replace(/^「|」$/g, '').slice(0, 12);
    // 截到括號中間就把半個括號拿掉
    return (t.match(/（/g) || []).length > (t.match(/）/g) || []).length ? t.replace(/（[^）]*$/, '') : t;
  };
  const sat = (v, op, n) => ({'=': v === n, '≠': v !== n, '<': v < n, '≤': v <= n, '>': v > n, '≥': v >= n})[op];
  function lastChoice(list) {
    for (let i = list.length - 1; i >= 0; i--) {
      const part = stepPart(list[i]);
      if (part && (part.kind === 'choice' || part.kind === 'battle')) return part.text.replace(needTail(), '');
    }
    return null;
  }
  // 腳本內的選項優先；否則看「怎麼進到這段」：所有入口都是同一個選項才算，入口選項不同代表選哪個都行
  function choiceOf(x) {
    const own = lastChoice(x.path || []);
    if (own) return own;
    const nearest = (x.entry || [])[0];
    if (nearest) {
      const via = new Set((nearest.options || []).map(o => lastChoice(o.path)));
      if (via.size === 1 && [...via][0]) return [...via][0];
    }
    // 再往回：這段劇情最短的進入路線上最後一個選項
    return lastChoice((G.scriptVia || {})[x.s] || []);
  }
  // 暫存旗標：在同一個事件的腳本裡找設定位置
  // 這段腳本是從哪裡接過來的（同一個事件裡的哪個分支）：給 choiceOf 用
  function enteredBy(s, list) {
    const options = [];
    for (const sc of list) walkItems(G.scripts[sc]?.items, (it, path) => { if (it.t === 'next' && it.s.toLowerCase() === s) options.push({from: sc, path}); });
    return options.length ? [{into: s, options}] : [];
  }

      + T("<div class=\"fdrawer\" id=\"fdrawer\"><span class=\"empty\">點流程圖上的格子，這裡會顯示那一段的選項、條件和怎麼進來。</span></div>");

  // 點節點：下方顯示路徑（怎麼走到這格）和那一段的細節
  function flowSelect(id) {
    if (!flowState) return;

    if (!n) return;
    if (n.kind === 'ext') { revealEvent(n.ev); return; }
    if (n.kind === 'ref' && n.target) {
      let t = m.nodes.find(x => ((x.kind === 'seg' && x.s === n.target) || x.seg === n.target));
      if (t && t.mergedInto) t = t.mergedInto;
      if (t && t.d != null) { flowSelect(t.id); detail.querySelector(`[data-fn="${t.id}"]`)?.scrollIntoView({block: 'center', inline: 'center'}); }

    detail.querySelectorAll('.fn.sel').forEach(x => x.classList.remove('sel'));
    detail.querySelector(`[data-fn="${id}"]`)?.classList.add('sel');

    m.nodes.forEach(p => p.kids.forEach(k => parent.set(k.id, p)));

    for (let p = parent.get(n.id); p; p = parent.get(p.id)) if (p.kind !== 'seg' || p.root) path.unshift(p.kind === 'seg' ? p.short : p.full || p.label);

        + T("<span style=\"color:var(--muted);font-weight:400;margin-left:8px\">寬度</span><button data-dw=\"0.5\">½</button><button data-dw=\"0.75\">¾</button></span></h3>");
      if (/^hub/.test(e.part || '') && text) html += T("<div class=\"hubnote\">這是<b>每旬重複的選單</b>：選一個地點，看完回到選單（「↩ 回到選單」）。地點前的 ✓／◐／○ 是讀過多少。</div>");
      else if (e.menu) html += T("<div class=\"hubnote\">這是<b>停留期間重複的選單</b>：選一個行動，看完回到選單；行動次數用完就換旬，到時間接下一段劇情。</div>");

  detail.addEventListener('click', ev => {

    if (all.length > setters.length) html += T("<span class=\"empty\">（另有 {0} 處設為不符合的值，已隱藏）</span>", all.length - setters.length);

  // ---------- 結緣步驟：把前置條件樹攤平成依時間排序的段落 ----------
  // 劇本裡沒有直接設定、而是在戰鬥或系統中累積的旗標，補上人工說明
  const FLAG_HINTS = {
    M50044: T("第二場對魔小梅的戰鬥中，每發動一次嘴攻 +1（累積到 6 直接判勝）"),
  };
  // ---- 步驟白話化：只留「要選的選項」和「屬性／好感／技能等條件」；
  //      正向的旗標條件會在下方「需要 旗標…」逐一說明來源，這裡省略 ----
  const NEG_OP = {'=': '≠', '≠': '=', '≥': '<', '>': '≤', '≤': '>', '<': '≥'};
  const isFlagAtom = a => /^（?旗標 /.test(a.trim());
  function negateAtom(a) {
    a = a.trim().replace(/^（(.*)）$/, '$1');
    if (a.startsWith('還沒選過')) return a.replace('還沒選過', '已選過');
    if (a.startsWith('已選過')) return a.replace('已選過', '還沒選過');
    const m = a.match(/^(.*) (=|≠|≥|>|≤|<) (.*)$/);
    return m ? `${m[1]} ${NEG_OP[m[2]]} ${m[3]}` : T("不是「{0}」", a);
  }
  // 一般條件：拿掉旗標，剩下的屬性條件用「、」「或」串起來
  // 好幾種道具的持有數加總

      if (t.conds) html += T("<h4>條件</h4><ul class=\"guide\">{0}</ul>", t.conds.map(briefItem).join(''));

      if (guide) html += T("<h4>達成條件</h4>") + guideHtml(guide);
      let auto = '';
      if (!t.routes.length) auto += T("<div class=\"empty\">劇本中沒有直接設定</div>");
      t.routes.forEach((r, i) => auto += `<h4>${t.routes.length > 1 ? T("路線 {0}", i + 1) : T("達成步驟")}</h4>` + routeHtml(r, t.flag).replace(T("★ 結緣成立"), T("★ 達成（{0} = {1}）", esc(t.flag), t.val)));

  // ---------- 唐門地點事件 ----------
  // 角色名稱統一用全名（旗標備註裡是小名）
  const NICK = {'小竹': '郁竹', '小梅': '虞小梅', '小蘭': '夏侯蘭', '小菊': '魏菊', '馬富貴': '李富貴'};
  const fullName = n => NICK[n] || n;
  const RESIDENTS = new Set(['大師兄', '二師兄', '三師兄', '四師兄', '小師妹', '掌門人', '主角']);
  // 還沒有結局事件的女主角：五塊錢、唐門地點事件先不列

  const shownName = n => !NOT_NAMED.test(n) && !HIDDEN_HEROINES.has(n);

  function presence(cond) {
    const inn = new Set(), out = new Set();
    for (const m of String(cond).matchAll(FLAG_ATOM)) {
      const note = (G.flagNotes || {})[m[1]] || '';
      let who = note.match(/^(.+?)(不在|在|加入)唐門$/);
      if (!who) { const c = note.match(/^([^\s\d]{2,3})同行/); if (c) who = [c[0], c[1], '在']; }
      if (!who || who[1] === '主角') continue;
      const n = Number(m[3]);
      const truthy = (m[2] === '=' && n >= 1) || (m[2] === '≥' && n >= 1) || (m[2] === '>' && n >= 0) || (m[2] === '≠' && n === 0);
      const present = who[2] === '不在' ? !truthy : truthy;

  // 只發生一次：條件裡有「這個事件自己的旗標 = 0」

  const onceFlag = c => [...String(c.cond).matchAll(FLAG_ATOM)].find(m => m[2] === '=' && m[3] === '0' && (m[1] === c.id || m[1] === c.once));
  // 連上遊戲時判斷「現在能不能抽到」：只看旗標與時間，其他條件不明就不標
  function condNow(cond) {
    if (!cond) return true;
    if (!LIVE || !LIVE.inGame || !LIVE.time) return null;
    const groups = String(cond).split(' 或 ').map(g => g.split(' 且 ').map(a => a.trim().replace(/^（(.*)）$/, '$1')));
    let unknown = false;
    const evalAtom = a => {
      let m = a.match(/^旗標 ([A-Za-z0-9_]+)(?:（[^）]*）)? (=|≠|<|≤|>|≥) (-?\d+)$/);
      if (m) return sat(liveValue('flag', m[1]), m[2], Number(m[3]));
      m = a.match(/^目前時間 (=|≠|<|≤|>|≥) 第(\d+)年(\d+)月(上|中|下)旬$/);
      if (m) return sat(idx(LIVE.time), m[1], idx({y: +m[2], m: +m[3], s: '　上中下'.indexOf(m[4])}));
      return undefined;
    };
    for (const g of groups) {
      const vals = g.map(evalAtom);
      if (vals.some(v => v === false)) continue;
      if (vals.every(v => v === true)) return true;
      unknown = true;
    }
    return unknown ? null : false;
  }
  // 已讀狀態：和五塊錢同一套算法（性格／技能台詞差分看過一種就算讀過），連同事件後續的子段落一起看
  let unreadIndex = null;
  function unreadIndexOf(s) {
    if (!unreadIndex) { unreadIndex = new Map(); for (const u of G.unread) unreadIndex.set(u.s, u); }
    return unreadIndex.get(s);
  }
  function readBadge(script, raw) {
    if (raw == null || (!G.stats.readKeys && !LIVE_READ.size)) return '';
    if (!unreadIndex) {
      unreadIndex = new Map();
      for (const u of G.unread) unreadIndex.set(u.s, u);
    }
    const parts = [...unreadIndex.values()].filter(u => u.read < 1 && (u.s === script || u.s.startsWith(script + '_')));
    const main = unreadIndex.get(script);
    const r = main && main.read < 1 ? main.read : 1;
    if (!parts.length) return T("<span class=\"rd r-read\" title=\"這段劇情都看過了\">已讀</span>");
    if (r === 0 && parts.every(u => u.read === 0)) return T("<span class=\"rd r-unread\" title=\"還沒看過\">未讀</span>");
    const left = parts.reduce((a, u) => a + Math.round(u.lines * (1 - u.read)), 0);
    return T("<span class=\"rd r-part\" title=\"還有約 {0} 句沒看過（怎麼看到見「五塊錢」分頁）\">部分 {1}%</span>", left, Math.round(r * 100));
  }
  function liveGroup(group) {
    const list = LIVE_POS && LIVE_POS[group];
    if (!list || !list.length) return null;
    const seen = new Set(), picks = [];
    for (const x of list) if (x.rate > 0 && !seen.has(x.code)) { seen.add(x.code); picks.push(x); }
    const total = picks.reduce((a, x) => a + x.rate, 0);
    const prob = new Map();
    let lo = 1;
    for (const x of picks) {
      const hi = lo + x.rate - 1;
      prob.set(x.id, total ? Math.max(0, Math.min(hi, total) - lo + 1) / total : 0);
      lo = hi + 1;
    }
    return new Map(list.map(x => [x.id, {...x, prob: prob.get(x.id) || 0}]));
  }
  // 條件逐條顯示，遊戲判斷不成立的那幾條標紅
  function condAtomsHtml(cond, atoms, onceAtom) {
    const parts = String(cond).split(/( 且 | 或 )/);
    const items = parts.filter((_, i) => i % 2 === 0);
    if (!atoms || atoms.length !== items.length) return null;
    let html = '', k = 0;
    parts.forEach((part, i) => {
      if (i % 2 === 1) { html += part.trim() === '且' ? '、' : T(" 或 "); return; }
      const ok = atoms[k++];
      if (onceAtom && part.trim() === onceAtom.trim()) { html += ok ? '' : T("<span class=\"bad\">已發生過</span>"); return; }
      const text = plainCondHtml(part);
      html += ok ? text : T("<span class=\"bad\" title=\"目前不成立\">{0}</span>", text);
    });
    return html.replace(/^、|、$/g, '').replace(/、、/g, '、');
  }
  // 兩層地點的第一層裡「沒人插進來、直接接行動結果」的候選（腳本只有接 var1）
  function passThrough(layer) {
    const ok = c => { const it = (G.scripts[c.script] || {}).items || []; return it.length > 0 && it.every(x => x.t === 'next_var' && x.v === 'var1'); };
    const list = layer.candidates.filter(ok);
    return (list.find(c => c.code === '001') || list[0] || {}).id || '';
  }
  function placeEventHtml(c, kindLabel, lv, need, pass) {
    const pr = presence(c.cond);
    // 選項本身的出現條件（例如雜匠要小竹在唐門）也算進要在場的人
    if (need) presence(need).inn.forEach(n => { if (!pr.inn.includes(n)) pr.inn.unshift(n); });
    const once = onceFlag(c);
    let cond = c.cond;
    if (once) cond = cond.replace(once[0], '').replace(/^ 且 | 且 $/g, '').replace(/ 且  且 /g, ' 且 ');
    const who = [...new Set([...pr.inn, ...(c.chars || []).map(fullName)])].filter(shownName);
    const inn = pr.inn.filter(shownName);
    const now = lv ? lv.rate > 0 : condNow(c.cond);
    const mark = now === null ? '' : `<span class="ck ${now ? 'ok' : 'no'}" title="${now ? T("目前可能抽到") : T("目前條件不符")}">${now ? '✓' : '✗'}</span>`;
    const title = c.note || (c.title || '').slice(0, 30) || c.script;
    const hide = unread(c.read) ? ' unreadtxt' : '';
    const bonus = (c.bonus || []).map((b, i) => {
      const on = lv && lv.bonus && lv.bonus[i];
      return T("{0}{1} 時 {2}{3}{4}", on ? '<b>' : '', plainCondHtml(b.cond), b.rate > 0 ? '+' : '', b.rate, on ? T("（目前成立）</b>") : '');
    }).join('；');
    const live = lv ? (lv.rate > 0 ? T("　<span class=\"live\">目前權重 {0}・機率 {1}%</span>", lv.rate, (lv.prob * 100).toFixed(1)) : T("　<span class=\"bad\">目前不會出現</span>")) : '';
    const condHtml = lv && c.cond ? condAtomsHtml(c.cond, lv.atoms, once && once[0]) : null;
    const forced = LIVE_FORCED.has(c.id);

    const force = LIVE && LIVE.inGame && LIVE_POS && (forced || (lv && lv.rate > 0)) ? `<button class="forcebtn${forced ? ' on' : ''}" data-force="${esc(c.id)}" data-pass="${esc(pass || '')}"`
      + ` title="${forced ? T("已鎖定：條件成立時一定抽到，播出後自動解除。點一下取消") : T("條件成立時不擲骰、直接觸發這個事件（播出後自動解除）")}">${forced ? T("🔒 已鎖定") : T("強制")}</button>` : '';
    return `<div class="plev" data-script="${esc(c.script)}">${force}${readBadge(c.script, c.read)}${mark}<span class="ttl${hide}">${esc(title)}</span>`
      + `${who.length ? `<span class="who">${esc(who.join('、'))}</span>` : ''}${inn.length > 1 ? T("<span class=\"multi\">需同時在唐門：{0}</span>", esc(inn.join('＋'))) : ''}`
      + `<div class="need">${kindLabel ? kindLabel + '　' : ''}${condHtml !== null ? (condHtml ? T("條件：") + condHtml : T("無條件")) : (cond ? T("條件：") + plainCondHtml(cond) : T("無條件"))}${once ? T("（只會發生一次）") : ''}`
      + T("　權重 {0}{1}{2}{3}</div></div>", c.rate, bonus ? `（${bonus}）` : '', live, c.title && c.note ? `<br><span class="${hide.trim()}">${esc(c.title.slice(0, 60))}</span>` : '');
  }
  let plWho = PREFS.plWho || '', plAll = !!PREFS.plAll;

    const top = romance.scrollTop;
    const pick = plWho;
    const showAll = plAll;
    loadIcons();
    const allWho = new Set();
    G.positions.forEach(p => p.layers.forEach(L => L.candidates.forEach(c => {
      // 篩選只看真的有出場的（說話、立繪、傳說或台詞裡提到、地點寫明是誰的）；條件裡要求「在唐門」的不算
      [...(c.chars || []).map(fullName), ...(p.who || [])].filter(shownName).forEach(n => allWho.add(n));
    })));
    let html = T("<div class=\"rintro\">在各養成地點行動時（唐門、留學、錦香宮…，旅途中的隨機事件也列在最後），遊戲會從「候選事件」裡依權重抽一個（實際機率 ＝ 權重 ÷ 當下所有符合條件事件的權重總和）。\n      後山、鍛冶場、大門、外堡會先抽一次「有沒有人插進來」，再抽行動結果，兩層都列在下面。\n      預設列出角色事件和特殊事件，平常、成功、失敗這些一般結果可勾選顯示；橘色標籤是要多人同時在唐門才會出現的。\n      最前面的「已讀／部分／未讀」連上遊戲時依遊戲的已讀紀錄即時更新。\n      {0}點事件會在右側顯示劇情。{1}</div>", LIVE && LIVE.inGame ? (LIVE_POS ? T("連上遊戲時顯示「目前權重・機率」（由遊戲本身計算，紅字是目前不成立的條件）。") : T("正在向遊戲取得目前機率…（需要時光機 Mod 0.6.0 以上）")) : '', LIVE && LIVE.inGame ? T("✓／✗ 是依目前存檔的旗標與時間判斷（其他屬性條件不判斷）。") : '');
    const fchip = (v, label) => `<button data-pl-who="${esc(v)}"${v === pick ? ' class="on"' : ''}>${label}</button>`;
    html += currentEventHtml();
    html += T("<div class=\"libtools\"><label><input type=\"checkbox\" id=\"plAll\"{0}>也列出一般結果（平常、成功、失敗等）</label></div>", showAll ? ' checked' : '')
      + T("<div class=\"libtools\"><div class=\"fchips\"><span>角色</span>{0}{1}</div></div>", fchip('', T("全部")), [...allWho].sort().map(n => fchip(n, iconImg(n) + esc(n))).join(''));
    let lastArea = '';
    const byPlace = new Map();

            if (!showAll && !related && !special) continue;
            if (pick && !present.includes(pick)) continue;
            rows += placeEventHtml(c, p.layers.length > 1 && li === 0 ? T("（先抽：有人插進來）") : '', live && live.get(c.id), p.need, li > 0 ? passThrough(p.layers[0]) : '');

  }

  // ---------- 五塊錢：還沒讀完的場景 ----------
  const REASON_KIND = {choice: T("選項"), switch: T("條件"), cond: T("條件"), dice: T("擲骰"), battle: T("戰鬥"), position: T("隨機"), variant: T("差分")};

    else if (r.kind === 'battle') what = /^勝利/.test(r.label) ? T("戰鬥勝利那段") : /^落敗/.test(r.label) ? T("戰鬥落敗那段") : T("另一種戰鬥結果");

    else {

      let label = r.label.replace(/　〔前提不是：.*〕$/, '').replace(/^(符合|不符合)：/, '');

  // 角色頭像：Mod 開的網頁才有（遊戲執行時從遊戲資料轉出來，不存檔案）；本機開檔或還沒轉好就只顯示名字
  let ICONS = null, iconTries = 0;
  async function loadIcons() {

  // 沒有小頭像的角色（孟仙謠）遊戲給的是細長半身像：裁出臉部的正方形，和其他人一樣是特寫

  let urState = PREFS.urState || '', urWho = PREFS.urWho || '';
  // 整段未讀：每條走得到的路線（沿途要選的選項、要符合的條件），最多列 3 條；

    // 事件的觸發說明：還沒觸發就分欄寫時間、地點、前置；觸發過的事件從別處接進來的，還是寫怎麼觸發

  // 分支標籤 → 白話；只有旗標的條件也轉成「在哪裡選了什麼」
  // 「前提不是：A；B」裡，和主條件矛盾的整項刪掉（本來就不可能成立），被主條件涵蓋的那幾個小條件省略
  const ATOM = /^(.+?) (=|≠|<|≤|>|≥) (-?\d+)$/;

  function isBoolFlag(f) {

  function atomRange(a) {
    const m = a.trim().replace(/^（(.*)）$/, '$1').match(ATOM);

    const n = Number(m[3]);
    const r = {'=': [n, n], '<': [-Infinity, n - 1], '≤': [-Infinity, n], '>': [n + 1, Infinity], '≥': [n, Infinity]}[m[2]];
    const out = {lhs: m[1], ne: m[2] === '≠' ? n : null, lo: r ? r[0] : -Infinity, hi: r ? r[1] : Infinity};
    const fm = m[1].match(/^旗標 ([A-Za-z0-9_]+)/);
    if (fm && isBoolFlag(fm[1])) {
      if (out.ne !== null) { out.lo = out.hi = out.ne === 0 ? 1 : 0; out.ne = null; }
      out.lo = Math.max(out.lo, 0); out.hi = Math.min(out.hi, 1);
    }
    return out;
  }

    : a.ne === null ? a.lo === a.hi && a.lo === b.ne : b.ne === null ? b.lo === b.hi && b.lo === a.ne : false);

  // 段落名稱：事件名＋進到這段的最後一個選擇（選項、擲骰、戰鬥結果、養成地點）；

  const segNumCache = new Map();

  const DAILY = [[/^talk_brother/, T("師兄弟閒聊")], [/^talk_girl/, T("閒聊")], [/^travel_result/, T("旅途事件")], [/^act\d/, T("開場")],

  function sceneName(u, ctx) {

    window.addEventListener('mousemove', ev => { if (drag) setDetailWidth(window.innerWidth - ev.clientX); });
    window.addEventListener('mouseup', () => { if (!drag) return; drag = false; sp.classList.remove('drag'); if (selected && PREFS.plotView !== 'text') renderDetail(byId.get(selected)); });
    sp.addEventListener('dblclick', () => { setDetailWidth(window.innerWidth * ((PREFS.detailW || 0.5) > 0.6 ? 0.5 : 0.75)); if (selected) renderDetail(byId.get(selected)); });
  }
  // ---- 右側欄開合：要寫內容進去的地方先打開（流程圖要量寬度）；✕／Esc 收起 ----
  let openTick = 0;
  function openDetail(open = true) {
    document.body.classList.toggle('dclosed', !open);
    if (!open) return;
    openTick++;
    document.body.classList.add('dhas');
    document.getElementById('dclose').style.top = detail.getBoundingClientRect().top + 8 + 'px';
  }
  document.getElementById('dclose').onclick = () => openDetail(false);
  // 收起時有重排過（篩選）：打開時照現在的寬度重畫
  document.getElementById('dopen').onclick = () => { openDetail(); if (detailStale && selected) renderDetail(byId.get(selected)); };
  // 點右側欄以外的地方就收起；這次點擊本身打開了右側欄（點事件、段落、月份）就不收
  // 按下時判斷位置：右側欄裡的點擊可能會重畫內容，放開時目標已經不在畫面上
  let downOutside = false, downTick = 0;
  document.addEventListener('mousedown', ev => {
    const keep = ['detail', 'flagpop', 'dclose', 'dopen', 'splitter'].map(id => document.getElementById(id));
    downOutside = !ev.composedPath().some(el => keep.includes(el));
    downTick = openTick;
  }, true);
  document.addEventListener('click', ev => {
    if (downOutside && openTick === downTick && !document.body.classList.contains('dclosed')) openDetail(false);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !document.body.classList.contains('dclosed') && !/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) openDetail(false);
  });
  // ---- 瀏覽器上一頁／下一頁：切換分頁、選事件都記一筆（連同捲動位置），按上一頁回到前一個畫面 ----
  let navRestoring = true;
  function navPush(st) {
    if (navRestoring) return;
    history.replaceState({...history.state, top: romance.scrollTop, dtop: detail.scrollTop}, '');
    history.pushState(st, '', `#view=${st.view}${st.ev ? '&ev=' + encodeURIComponent(st.ev) : ''}`);
  }
  window.addEventListener('popstate', e => {
    const st = e.state;
    if (!st) return;
    navRestoring = true;
    try {
      if (st.view !== currentView) setView(st.view);
      if (st.ev && st.ev !== selected && byId.has(st.ev)) select(st.ev, false);
      if (st.top != null) romance.scrollTop = st.top;
      if (st.dtop != null) detail.scrollTop = st.dtop;
    } finally { navRestoring = false; }
  });
  function setView(v) {
    document.body.classList.toggle('view-romance', v !== 'chart');
    for (const [view, id] of Object.entries(TAB_IDS)) document.getElementById(id).classList.toggle('on', view === v);
    document.getElementById('brand').classList.toggle('on', v === 'help');
    if (v !== currentView) navPush({view: v, ev: selected || null});
    if (v === 'chart') setMoreTabs(true);
    document.getElementById('hiddenToggle').style.display = 'none';
    currentView = v;
    if (v === 'romance') renderRomance();
    if (v === 'targets') renderTargets();
    if (v === 'places') renderPlaces();
    if (v === 'unread') renderUnread();
    if (v === 'help') renderHelp();
  }
  // ---------- 說明（點左上角「算命仙」）----------
  let helpSig = null;
  function renderHelp(keep) {
    const B = G.build || {}, now = LIVE && LIVE.live ? LIVE.gameVersion : null;
    const sig = `${now}|${LIVE && LIVE.modVersion}`;
    if (keep && sig === helpSig) return;
    helpSig = sig;
    const top = romance.scrollTop;
    // 一句一個 T()：改寫、翻譯時一格一句
    const card = (h, items) => `<div class="hcard"><h2>${h}</h2><ul class="guide">${items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    const langs = [['zh-TW', '繁體中文'], ['ja', '日本語'], ['ko', '한국어']];
    romance.innerHTML = card(T("版本"), [
      T("頁面資料：遊戲 {0}，{1} 建立", esc(B.gameVersion || T("（沒有記錄）")), esc(B.built || '')),
      T("目前遊戲：{0}", now ? esc(now) : LIVE && LIVE.live ? T("已連上，但這版 Mod 沒有回報版本") : T("沒連上遊戲（從遊戲裡按 F7 開才看得到）")),
      ...(LIVE && LIVE.modVersion ? [`Mod：${esc(LIVE.modVersion)}`] : []),
      ...(now && B.gameVersion && now !== B.gameVersion ? [`<span class="bad">${T("目前的遊戲版本和頁面資料不同：遊戲更新後條件可能有改，這份頁面可能不準。")}</span>`] : []),
    ]) + `<div class="hcard"><h2>${T("語言")}</h2><div class="rintro"><select id="langSel">${langs.map(([k, n]) => `<option value="${k}"${k === LANG ? ' selected' : ''}>${n}</option>`).join('')}</select>
      ${T("從遊戲按 F7 開時，預設是時光機設定檔的 Language。還沒翻譯的字顯示繁中。")}</div></div>`
    + card(T("資料來源與授權"), [
      T("事件名稱與部分結緣攻略整理自 {0}，依 {1} 授權使用；有修改（同名事件加註區分、攻略改寫並對照遊戲資料補上條件）。",
        `<a href="https://smilin.net/LoM-wiki/" target="_blank" rel="noopener">${T("smilin.net 活俠傳 wiki")}</a>`,
        '<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh_TW" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>'),
      T("條件、分支、未讀判斷是從遊戲劇本推出來的，可能不準。"),
    ]) + card(T("這個 Mod 能做什麼"), [
      T("<b>F6 時光機</b>：每一旬第一個能存檔的時間點自動存一份，按 F6 開格子視窗，點時間點就能讀回去。不占遊戲存檔欄位，也不會被 Steam 雲端同步。"),
      T("<b>關鍵節點</b>：葉家兄妹、留學、破廟、江陵、大師兄下山、小師妹招親、大雪山、武林大會、決策這些事件前，另外存一份「養成回合開始、行動次數全滿」的存檔。"),
      T("<b>存檔路線</b>：可以從目前時間分岔出新路線，各路線的存檔互不覆蓋。"),
      T("<b>F7 算命仙（這個網頁）</b>：五塊錢（還沒讀完的劇情）、地點事件、結緣條件、其他條件；「▸」裡還有流程圖。從遊戲裡按 F7 開才會連上遊戲，顯示目前存檔的狀態；流程圖點月份可以讀那個月的時光機存檔。"),
    ]) + `<div class="hcard"><h2>✓／✗</h2><div class="rintro">${T("✓／✗ 是你目前存檔的值；有些旗標在事件之後會被改掉，過了那個時間點的 ✗ 不一定代表當時沒達成。")}</div></div>`
    + card(T("五塊錢的未讀怎麼算"), [
      T("列出有台詞、但還沒讀完的劇情段落。已讀紀錄是從遊戲即時讀的：要從遊戲裡按 F7 開；沒連上遊戲時全部當成未讀。"),
      T("<b>差分</b>：只因性情、道德、處世、修養、學問或技能／天賦而換台詞（不是選項造成、走向相同）的地方，預設看過其中一種就算讀過；上方勾「列入差分」才每種都算。"),
      T("讀了一部分的段落，會列出沒讀到的台詞在哪個分支、要怎麼走才看得到（選哪個選項、符合什麼條件、擲骰、戰鬥勝負）。這是從劇本推出來的，不是存檔記下的原因。整段沒進去過的，列出怎麼進去。"),
      T("標記：「○ 未讀」整段沒讀過；「◐ N%」讀了 N%；「◇ 分支」玩過的事件裡整段沒走到的分支。"),
      T("<b>選了角色</b>：整段沒讀的，她有出場（說話、立繪、傳說）或旁白提到她就列；讀了一部分的，要有她說的台詞或旁白提到她的句子還沒讀才列；「其他」是沒有這些角色的。上方的句數只算她的句子。"),
      T("🏆 整段要成就：這段台詞要有某個成就（風雲史）才看得到；🏆 成就追加台詞：不用成就也看得到這段，有成就會多幾句。"),
      T("{0}：劇本裡找不到把旗標設成需要的值的地方（遊戲程式也可能會設，所以只是可能）。確定做不到的（未實裝的結緣、試玩版）直接不列。", MAYBE_TAG),
    ]);
    // 換語言：記在偏好裡，網址的 lang 一起換掉（從遊戲開時網址帶的是設定檔的語言）
    document.getElementById('langSel').onchange = e => { savePref('lang', e.target.value); location.href = location.pathname + '?lang=' + e.target.value + location.hash; };
    if (keep) romance.scrollTop = top;
  }
  for (const [view, id] of Object.entries(TAB_IDS)) document.getElementById(id).onclick = () => setView(view);
  document.getElementById('showHidden').addEventListener('change', renderRomance);

  async function showMonth(mc) {
    openDetail();
    const title = mc.title.split('：')[0];
    const [y, m] = mc.dataset.ym.split('-').map(Number);
    if (!ONLINE || !LIVE) { detail.innerHTML = T("<h2>{0}</h2><p class=\"empty\">沒有連到遊戲。用遊戲內的 F7 開啟這個頁面，就能在這裡讀取時光機存檔。</p>", esc(title)); return; }
    let list = [];
    try { list = await (await fetch('/api/timemachine', {cache: 'no-store'})).json(); } catch (e) {}
    const saves = list.filter(x => x.y === y && x.m === m);
    let html = `<h2>${esc(title)}</h2>${LIVE.route ? T("<div class=\"meta\">時光機路線：{0}（切換路線請用遊戲內 F6）</div>", esc(LIVE.route)) : ''}`;
    html += saves.length
      ? T("<div class=\"tmlist\">{0}</div><p class=\"empty\">讀檔後目前未存檔的進度會遺失。</p>", saves.map(x => T("<button data-tm=\"{0}\">讀取 {1}（{2}，{3}）</button>", esc(x.key), STAGE[x.s], x.scene === 'Free' ? T("養成") : T("劇情"), esc(x.saved))).join(''))
      : T("<p class=\"empty\">這個月沒有時光機存檔。</p>");
    detail.innerHTML = html;
  }
  detail.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-tm]');
    if (!b) return;
    if (!confirm(T("目前未存檔的進度會遺失，確定讀取？"))) return;
    await fetch('/api/load?key=' + encodeURIComponent(b.dataset.tm), {method: 'POST'});
    setTimeout(async () => {
      try {
        const r = await (await fetch('/api/lastload', {cache: 'no-store'})).json();
        b.insertAdjacentHTML('afterend', `<div class="empty">${r.result === 'ok' ? T("已送出讀檔，請回到遊戲。") : esc(r.result || T("處理中…"))}</div>`);
      } catch (e) {}
    }, 800);
  });

  const choiceCount = G.events.filter(e => e._choice).length;
  // 已讀句數：連上遊戲用遊戲的，否則用重建當下存檔的（發布版沒有就不寫）
  const statsText = () => {
    const n = LIVE_READ.size || G.stats.readKeys;
    document.getElementById('stats').textContent = T("{0} 個事件（主線 {1}）· 含選項 {2}{3}", SHOWN.length, SHOWN.filter(e => e.main).length, choiceCount, n ? T(" · 已讀文本 {0} 句", n) : '');
  };
  statsText();
  layout();
  poll();
  if (ONLINE) setInterval(poll, 3000);
  if (/view=romance/.test(location.hash)) setView('romance');
  if (/view=targets/.test(location.hash)) setView('targets');
  if (/view=libcg/.test(location.hash)) setView('romance');
  if (/view=chart/.test(location.hash)) setView('chart');
  if (/view=help/.test(location.hash)) setView('help');
  // 預設打開五塊錢
  if (!/view=|ev=/.test(location.hash)) setView('unread');
  if (/view=places/.test(location.hash)) setView('places');
  if (/view=unread/.test(location.hash)) setView('unread');
  const m = location.hash.match(/ev=([^&]+)/);
  if (m) { const id = decodeURIComponent(m[1]).toLowerCase(); if (byId.has(id)) revealEvent(id); }
  // 開頁面時的畫面當成第一筆，之後的操作才記
  history.replaceState({view: currentView, ev: selected || null}, '');
  navRestoring = false;
})();
</script>
</body>
</html>
