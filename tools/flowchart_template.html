      : (romance.querySelector(`.subev[data-sub-id="${CSS.escape(evId)}"]`) || romance.querySelector(`details.plcard summary [data-goto="${CSS.escape(evId)}"]`)?.closest('details'));
    let row = find();
    if (!row && (urState || urWho)) { urState = urWho = ''; savePref('urState', ''); savePref('urWho', ''); renderUnread(); row = find(); }
    if (!row) return;
    for (let p = row; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
    row.scrollIntoView({block: s ? 'center' : 'start'});
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1500);
  }
  function gotoPlace(script, place) {
    setView('places');
    if (place) {
      const card = romance.querySelector(`.plcard[data-place="${CSS.escape(place)}"]`);
      if (!card) return;
      card.scrollIntoView({block: 'start'});
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1500);
      return;
    }
    let row = romance.querySelector(`.plev[data-script="${CSS.escape(script)}"]`);
    if (!row && !plAll) { plAll = true; savePref('plAll', true); renderPlaces(); row = romance.querySelector(`.plev[data-script="${CSS.escape(script)}"]`); }
    if (!row && plWho) { plWho = ''; savePref('plWho', ''); renderPlaces(); row = romance.querySelector(`.plev[data-script="${CSS.escape(script)}"]`); }
    if (!row) return;
    for (let p = row.parentElement; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
    row.scrollIntoView({block: 'center'});
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1500);
  }
  romance.addEventListener('click', ev => {
    const sub = ev.target.closest('[data-sub]');
    if (sub) {
      const t = romance.querySelector(`.subev[data-sub-id="${CSS.escape(sub.dataset.sub)}"]`);
      if (t) { t.scrollIntoView({block: 'start'}); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1500); }
      return;
    }
    const pos = ev.target.closest('[data-pos],[data-place]');
    if (pos) { gotoPlace(pos.dataset.pos, pos.dataset.place); return; }
    const scene = ev.target.closest('[data-scene]');
    if (scene) {
      const o = !scriptOwner.has(scene.dataset.scene) && posOf(scene.dataset.scene);
      if (o) gotoPlace(o.c.script, o.entry && o.p.place); else jumpToScene(scene.dataset.scene);
      return;
    }
    const go = ev.target.closest('[data-goto]');
    if (go) {
      setView('chart');
      revealEvent(go.dataset.goto);
      return;
    }
    const el = ev.target.closest('[data-ev],[data-flag],[data-script],.unreadtxt');
    if (!el) return;
    if (el.dataset.script) showScript(el.dataset.script);
    else if (el.dataset.ev) select(el.dataset.ev, true);
    else if (el.dataset.flag) showFlag(el.dataset.flag, ev);
    else el.classList.add('reveal');
  });
  const TAB_IDS = {unread: 'tabUnread', places: 'tabPlaces', romance: 'tabRomance', targets: 'tabTargets', help: 'tabHelp', chart: 'tabChart', cheat: 'tabCheat'};
  // 流程圖、作弊平常摺疊在「▸」裡，點開才顯示；正在看的話一直顯示
  function setMoreTabs(open) {
    document.body.classList.toggle('moretabs', open);
    document.getElementById('tabMore').textContent = open ? '◂' : '▸';
  }
  document.getElementById('tabMore').onclick = () => setMoreTabs(!document.body.classList.contains('moretabs'));
  function setView(v) {
    document.body.classList.toggle('view-romance', v !== 'chart');
    for (const [view, id] of Object.entries(TAB_IDS)) document.getElementById(id).classList.toggle('on', view === v);
    if (v === 'chart' || v === 'cheat') setMoreTabs(true);
    document.getElementById('hiddenToggle').style.display = 'none';
    currentView = v;
    if (v === 'romance') renderRomance();
    if (v === 'targets') renderTargets();
    if (v === 'places') renderPlaces();
    if (v === 'unread') renderUnread();
    if (v === 'cheat') renderCheat();
    if (v === 'help') renderHelp();
  }
  // ---------- 說明 ----------
  function renderHelp() {
    romance.innerHTML = `<div class="hcard"><h2>這個 Mod 能做什麼</h2><ul class="guide">
      <li><b>F6 時光機</b>：每一旬第一個能存檔的時間點自動存一份，按 F6 開格子視窗，點時間點就能讀回去。不占遊戲存檔欄位，也不會被 Steam 雲端同步。</li>
      <li><b>關鍵節點</b>：葉家兄妹、留學、破廟、江陵、大師兄下山、小師妹招親、大雪山、武林大會、決策這些事件前，另外存一份「養成回合開始、行動次數全滿」的存檔。</li>
      <li><b>存檔路線</b>：可以從目前時間分岔出新路線，各路線的存檔互不覆蓋。</li>
      <li><b>F7 算命仙（這個網頁）</b>：五塊錢（還沒讀完的劇情）、地點事件、結緣條件、其他條件；「▸」裡還有流程圖、作弊。從遊戲裡按 F7 開才會連上遊戲，顯示目前存檔的狀態；流程圖點月份可以讀那個月的時光機存檔。</li>
    </ul></div>
    <div class="hcard"><h2>✓／✗</h2><div class="rintro">✓／✗ 是你目前存檔的值；有些旗標在事件之後會被改掉，過了那個時間點的 ✗ 不一定代表當時沒達成。</div></div>
    <div class="hcard"><h2>五塊錢的未讀怎麼算</h2><ul class="guide">
      <li>列出有台詞、但還沒讀完的劇情段落。已讀紀錄是從遊戲即時讀的：要從遊戲裡按 F7 開；沒連上遊戲時全部當成未讀。</li>
      <li><b>差分</b>：只因性情、道德、處世、修養、學問或技能／天賦而換台詞（不是選項造成、走向相同）的地方，預設看過其中一種就算讀過；上方勾「列入差分」才每種都算。</li>
      <li>讀了一部分的段落，會列出沒讀到的台詞在哪個分支、要怎麼走才看得到（選哪個選項、符合什麼條件、擲骰、戰鬥勝負）。這是從劇本推出來的，不是存檔記下的原因。整段沒進去過的，列出怎麼進去。</li>
      <li>標記：「○ 未讀」整段沒讀過；「◐ N%」讀了 N%；「◇ 分支」玩過的事件裡整段沒走到的分支。</li>
      <li><b>選了角色</b>：整段沒讀的，她有出場（說話、立繪、傳說）或旁白提到她就列；讀了一部分的，要有她說的台詞或旁白提到她的句子還沒讀才列；「其他」是沒有這些角色的。上方的句數只算她的句子。</li>
      <li>🏆 整段要成就：這段台詞要有某個成就（風雲史）才看得到；🏆 成就追加台詞：不用成就也看得到這段，有成就會多幾句。</li>
      <li>${MAYBE_TAG}：劇本裡找不到把旗標設成需要的值的地方（遊戲程式也可能會設，所以只是可能）。確定做不到的（未實裝的結緣、試玩版）直接不列。</li>
    </ul></div>`;
  }
  // ---------- 作弊：開關存在 Mod 的設定檔 ----------
  const CHEATS = [
    {id: 'showAllDecisions', name: '決策時顯示全部選項',
     desc: '第3年12月三師兄召集的決策：滿足西武林盟條件（可成立西武林盟）時，遊戲會藏起「決策：戰他娘親」（頑抗路線）和「決策：退隱江湖」（解散唐門）。打開後這兩個也會出現，可以自己選。'},
  ];
  async function renderCheat() {
    let state = null;
    if (ONLINE) { try { state = await (await fetch('/api/cheats', {cache: 'no-store'})).json(); } catch (e) { state = null; } }
    let html = `<div class="rintro">遊戲本來不允許的選擇。開關存在 Mod 的設定檔（BepInEx\\config 的 Cheat 區），重開遊戲也會保留；${state ? '' : '<b>要從遊戲裡按 F7 開這個網頁、而且 Mod 是 0.7.7 以上才能切換。</b>'}</div>`;
    for (const c of CHEATS) {
      const on = !!(state && state[c.id]);
      html += `<div class="hcard"><h2>${esc(c.name)}<button class="forcebtn${on ? ' on' : ''}" data-cheat="${c.id}" ${state ? '' : 'disabled'}>${on ? '已開啟' : '關閉中'}</button></h2><div class="rintro">${esc(c.desc)}</div></div>`;
    }
    html += await relCheatHtml(!!state);
    romance.innerHTML = html;
    romance.querySelectorAll('[data-cheat]').forEach(b => b.onclick = async () => {
      const on = !(state && state[b.dataset.cheat]);
      try { await fetch(`/api/cheat?id=${b.dataset.cheat}&on=${on ? 1 : 0}`, {method: 'POST'}); } catch (e) { }
      renderCheat();
    });
    // 好感：加減、設成、結識（Mod 排到遊戲主執行緒做，約 1 秒後重抓）
    const relPost = async (key, args) => {
      try { await fetch(`/api/rel?key=${encodeURIComponent(key)}&${args}`, {method: 'POST'}); } catch (e) { }
      setTimeout(renderCheat, 1300);
    };
    romance.querySelectorAll('[data-rel-add]').forEach(b => b.onclick = () => relPost(b.dataset.key, `add=${b.dataset.relAdd}`));
    romance.querySelectorAll('[data-rel-set]').forEach(b => b.onclick = () => {
      const v = b.parentElement.querySelector('input').value;
      if (v !== '') relPost(b.dataset.key, `set=${encodeURIComponent(v)}`);
    });
    romance.querySelectorAll('[data-rel-meet]').forEach(b => b.onclick = () => relPost(b.dataset.key, `meet=1${b.dataset.flag ? '&flag=' + b.dataset.flag : ''}`));
  }
  // 「認識 X」旗標（開發備註）對應到角色：備註用小名
  const MEET_NICK = {'小梅': '虞小梅', '小蘭': '夏侯蘭', '小竹': '郁竹', '小菊': '魏菊', '馬富貴': '李富貴', '毛二壯': '王二壯'};
  const MEET_FLAG = Object.fromEntries(Object.entries(G.flagNotes || {}).map(([f, n]) => {
    const m = n.match(/^認識(.+)$/);
    return m ? [MEET_NICK[m[1]] || m[1], f] : null;
  }).filter(Boolean));
  async function relCheatHtml(online) {
    let html = `<div class="hcard"><h2>好感與結識</h2><div class="rintro">直接改目前遊戲裡的好感（0～100）。「設成已結識」會讓角色出現在人際關係，並把劇情條件用的「認識 X」旗標設成 1（有這個旗標的角色才會設）。改完約 1 秒後更新；記得存檔。</div>`;
    if (!online) return html + '<div class="empty">要從遊戲裡按 F7 開這個網頁才能使用。</div></div>';
    let rels = [];
    try { rels = await (await fetch('/api/rels', {cache: 'no-store'})).json(); } catch (e) { }
    if (!rels.length) return html + '<div class="empty">讀檔進入遊戲後才能使用。</div></div>';
    const hero = new Set(HEROINE_NAMES_ALL);
    rels = rels.filter(r => r.key !== '主角').sort((a, b) => (hero.has(b.key) - hero.has(a.key)) || b.value - a.value);
    html += '<table class="reltab"><tr><th>角色</th><th>好感</th><th>調整</th><th>結識</th></tr>';
    for (const r of rels) {
      const flag = MEET_FLAG[r.key];
      const flagOn = flag ? liveValue('flag', flag) === 1 : true;
      const met = r.active && flagOn;
      html += `<tr><td>${iconImg(r.key)}${esc(r.key)}</td><td><b>${r.value}</b></td><td>`
        + [-10, -1, 1, 10].map(d => `<button class="forcebtn" data-key="${esc(r.key)}" data-rel-add="${d}">${d > 0 ? '+' : ''}${d}</button>`).join('')
        + `　<input type="number" min="0" max="100" style="width:56px"><button class="forcebtn" data-key="${esc(r.key)}" data-rel-set="1">設成</button></td>`
        + `<td>${met ? '<span class="need">已結識</span>' : `<button class="forcebtn" data-key="${esc(r.key)}" data-rel-meet="1" data-flag="${flag || ''}">設成已結識</button>`}`
        + `${flag ? `<span class="need">　${esc(flag)}${flagOn ? ' ✓' : ''}</span>` : ''}</td></tr>`;
    }
    return html + '</table></div>';
  }
  for (const [view, id] of Object.entries(TAB_IDS)) document.getElementById(id).onclick = () => setView(view);
  document.getElementById('showHidden').addEventListener('change', renderRomance);

  async function showMonth(mc) {
    const title = mc.title.split('：')[0];
    const [y, m] = title.match(/\d+/g).map(Number);
    if (!ONLINE || !LIVE) { detail.innerHTML = `<h2>${esc(title)}</h2><p class="empty">沒有連到遊戲。用遊戲內的 F7 開啟這個頁面，就能在這裡讀取時光機存檔。</p>`; return; }
    let list = [];
    try { list = await (await fetch('/api/timemachine', {cache: 'no-store'})).json(); } catch (e) {}
    const saves = list.filter(x => x.y === y && x.m === m);
    let html = `<h2>${esc(title)}</h2>${LIVE.route ? `<div class="meta">時光機路線：${esc(LIVE.route)}（切換路線請用遊戲內 F6）</div>` : ''}`;
    html += saves.length
      ? `<div class="tmlist">${saves.map(x => `<button data-tm="${esc(x.key)}">讀取 ${STAGE[x.s]}（${x.scene === 'Free' ? '養成' : '劇情'}，${esc(x.saved)}）</button>`).join('')}</div><p class="empty">讀檔後目前未存檔的進度會遺失。</p>`
      : '<p class="empty">這個月沒有時光機存檔。</p>';
    detail.innerHTML = html;
  }
  detail.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-tm]');
    if (!b) return;
    if (!confirm('目前未存檔的進度會遺失，確定讀取？')) return;
    await fetch('/api/load?key=' + encodeURIComponent(b.dataset.tm), {method: 'POST'});
    setTimeout(async () => {
      try {
        const r = await (await fetch('/api/lastload', {cache: 'no-store'})).json();
        b.insertAdjacentHTML('afterend', `<div class="empty">${r.result === 'ok' ? '已送出讀檔，請回到遊戲。' : esc(r.result || '處理中…')}</div>`);
      } catch (e) {}
    }, 800);
  });

  const choiceCount = G.events.filter(e => e._choice).length;
  // 已讀句數：連上遊戲用遊戲的，否則用重建當下存檔的（發布版沒有就不寫）
  const statsText = () => {
    const n = LIVE_READ.size || G.stats.readKeys;
    document.getElementById('stats').textContent = `${SHOWN.length} 個事件（主線 ${SHOWN.filter(e => e.main).length}）· 含選項 ${choiceCount}${n ? ` · 已讀文本 ${n} 句` : ''}`;
  };
  statsText();
  layout();
  poll();
  if (ONLINE) setInterval(poll, 3000);
  if (/view=romance/.test(location.hash)) setView('romance');
  if (/view=targets/.test(location.hash)) setView('targets');
  if (/view=libcg/.test(location.hash)) setView('romance');
  if (/view=chart/.test(location.hash)) setView('chart');
  if (/view=cheat/.test(location.hash)) setView('cheat');
  if (/view=help/.test(location.hash)) setView('help');
  // 預設打開五塊錢
  if (!/view=|ev=/.test(location.hash)) setView('unread');
  if (/view=places/.test(location.hash)) setView('places');
  if (/view=unread/.test(location.hash)) setView('unread');
  const m = location.hash.match(/ev=([^&]+)/);
  if (m) { const id = decodeURIComponent(m[1]).toLowerCase(); if (byId.has(id)) revealEvent(id); }
})();
</script>
</body>
</html>
